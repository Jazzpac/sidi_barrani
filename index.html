<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12352a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jass">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Sidi Barrani</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Barlow+Semi+Condensed:wght@400;500;600&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: Ein-Bildschirm-Jasstisch. Kopf mit Kreide-Jasstafel, darunter der Filz mit vier Sitzen und Stichfeld. */
:root {
  --felt: #1d4a38;
  --felt-deep: #12352a;
  --slate: #26302c;
  --chalk: #efede3;
  --chalk-dim: #b9bcae;
  --paper: #fbf5e6;
  --ink: #2a2520;
  --brass: #d8a531;
  --red: #b52a2f;
  --line: rgba(239, 237, 227, .18);
  --f-display: 'Grenze Gotisch', 'UnifrakturMaguntia', Georgia, serif;
  --f-body: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-chalk: 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive;
  --cw: clamp(46px, 11.5vw, 82px);   /* Handkarten; wird per JS an Breite und Höhe angepasst */
  --bw: calc(var(--cw) * .5);        /* Kartenrücken der Mitspieler */
  --tw: var(--cw);                   /* Karten im Stich */
  --overlap: 0px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 45%, var(--felt) 0%, var(--felt-deep) 85%);
  background-color: var(--felt-deep);
  color: var(--chalk);
  font-family: var(--f-body);
  font-size: 15px;
  overflow: hidden;
}
#app {
  height: 100%; height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 8px 6px;
  gap: 6px;
  box-sizing: border-box;
  max-width: 980px;
  margin: 0 auto;
}
button { font-family: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* ---------- Kopf: Titel + Jasstafel ---------- */
header {
  display: flex; align-items: stretch; gap: 10px; justify-content: space-between; flex-wrap: wrap;
}
.brand { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 5vw, 36px); line-height: .95; margin: 0; letter-spacing: .5px; color: var(--brass); }
.brand .sub { font-size: 12px; color: var(--chalk-dim); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
.tafel {
  background: var(--slate);
  border: 5px solid #6b4b2a;
  border-radius: 4px;
  box-shadow: inset 0 0 18px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.35);
  padding: 4px 12px 4px;
  display: grid; grid-template-columns: auto auto; column-gap: 18px; align-items: baseline;
  font-family: var(--f-chalk); color: var(--chalk);
  flex: 0 1 auto;
}
.tafel .who { font-size: 17px; color: var(--chalk-dim); white-space: nowrap; }
.tafel .pts { font-size: 26px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; line-height: 1.05; }
.kontra-btn {
  grid-column: 1 / -1; position: relative; overflow: hidden; margin-top: 5px;
  font-family: var(--f-body); font-weight: 600; font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
  border: 1.5px dashed var(--line); border-radius: 4px; background: transparent; color: var(--chalk-dim);
  padding: 4px 8px; cursor: not-allowed; line-height: 1.15;
}
.kontra-btn small { display: block; font-size: 11px; letter-spacing: .02em; text-transform: none; font-weight: 500; }
.kontra-btn:not(:disabled) {
  cursor: pointer; border: 1.5px solid #ff8a8f; background: var(--red); color: #fff;
  box-shadow: 0 0 0 0 rgba(255, 120, 120, .7); animation: kpulse 1.1s ease-out infinite;
}
.kontra-btn.timed::after {
  content: ""; position: absolute; left: 0; bottom: 0; height: 3px; background: #fff; width: 100%;
  animation: kdrain 3s linear forwards;
}
@keyframes kpulse { to { box-shadow: 0 0 0 8px rgba(255, 120, 120, 0); } }
@keyframes kdrain { to { width: 0; } }
@media (prefers-reduced-motion: reduce) { .kontra-btn:not(:disabled) { animation: none; } }
.call {
  display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  background: var(--paper); color: var(--ink); border-radius: 6px; padding: 2px 9px;
  font-size: 15px; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,.35);
}
.call svg { width: 17px; height: 17px; }
.call.pass { background: transparent; color: var(--chalk-dim); border: 1px solid var(--line); box-shadow: none; font-weight: 500; }
.call.hi { background: var(--brass); color: #2a1d05; outline: 2px solid #fff3c4; }
.call.kontra { background: var(--red); color: #fff; }
.seat.s .call { margin-top: 2px; }
.tafel .goal { grid-column: 1 / -1; font-size: 14px; color: var(--chalk-dim); border-top: 1px dashed var(--line); margin-top: 2px; text-align: center; }
.tools { display: flex; gap: 6px; align-items: center; }
.ghost {
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--chalk);
}
.ghost:hover { border-color: var(--brass); color: var(--brass); }

/* ---------- Tisch ---------- */
.table {
  position: relative; min-height: 0;
  display: grid;
  grid-template-columns: minmax(54px, auto) 1fr minmax(54px, auto);
  grid-template-rows: auto auto 1fr auto auto;
  grid-template-areas: "n n n" "info info info" "w c e" "status status status" "s s s";
  gap: 4px;
}
.seat { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.seat.n { grid-area: n; }
.seat.w { grid-area: w; justify-content: center; }
.seat.e { grid-area: e; justify-content: center; }
.seat.s { grid-area: s; }
.name {
  font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--chalk-dim);
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
}
.name.turn { color: var(--brass); }
.name.turn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brass); box-shadow: 0 0 8px var(--brass); }
.name .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; letter-spacing: .04em; }
.backs { display: flex; }
.backs.v { flex-direction: column; }
.back {
  width: var(--bw); height: calc(var(--bw) * 1.5);
  border-radius: 4px; border: 1.5px solid var(--paper);
  background:
    repeating-linear-gradient(45deg, rgba(251,245,230,.18) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(-45deg, rgba(251,245,230,.18) 0 2px, transparent 2px 7px),
    #8e2328;
  box-shadow: 0 1px 2px rgba(0,0,0,.4);
}
.backs .back + .back { margin-left: calc(var(--bw) * -.72); }
.backs.v .back { width: var(--bw); height: calc(var(--bw) * .68); }
.backs.v .back + .back { margin-left: 0; margin-top: calc(var(--bw) * -.44); }

.info { grid-area: info; display: flex; justify-content: center; min-height: 26px; }
.contract {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 14px;
  background: rgba(0,0,0,.18);
}
.contract b { color: var(--brass); font-weight: 600; }
.contract .k { color: #fff; background: var(--red); border-radius: 3px; padding: 0 6px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
.contract svg { width: 18px; height: 18px; vertical-align: middle; }
svg[viewBox^="-17"] { width: 25px !important; }
.x { font-size: .82em; font-weight: 700; color: var(--brass); margin-left: 2px; font-variant-numeric: tabular-nums; }
.chip .x, .call .x { color: #8a2a1e; }
.chip[aria-pressed="true"] .x { color: var(--paper); }
.contract .dir {
  display: inline-flex; align-items: center; gap: 4px; margin-left: 2px;
  background: var(--paper); color: var(--ink); border-radius: 4px; padding: 0 7px; font-weight: 600;
}
.contract .dir.flip { background: var(--brass); color: #2a1d05; animation: pop .25s ease-out; }
@media (prefers-reduced-motion: reduce) { .contract .dir.flip { animation: none; } }

.center { grid-area: c; position: relative; min-height: calc(var(--tw) * 2.6); }
.center .card { width: var(--tw); height: calc(var(--tw) * 1.5); }
.slot { position: absolute; transform: translate(-50%, -50%); transition: transform .25s ease; }
.slot.p0 { left: 50%; top: 74%; }
.slot.p1 { left: 74%; top: 50%; }
.slot.p2 { left: 50%; top: 26%; }
.slot.p3 { left: 26%; top: 50%; }
.slot.win .card { box-shadow: 0 0 0 3px var(--brass), 0 4px 14px rgba(0,0,0,.5); }

.status {
  grid-area: status; text-align: center; font-size: 14px; color: var(--chalk); min-height: 20px;
}
.status em { font-style: normal; color: var(--brass); }

/* ---------- Karten ---------- */
.card {
  width: var(--cw); height: calc(var(--cw) * 1.5);
  padding: 0; border: none; background: none; border-radius: 6px; display: block;
  box-shadow: 0 2px 5px rgba(0,0,0,.4);
  flex: 0 0 auto;
}
.card svg { width: 100%; height: 100%; display: block; }
.hand { display: flex; justify-content: center; padding-top: 10px; max-width: 100%; }
.hand .card { cursor: default; transition: transform .15s ease, filter .15s; }
.hand .card + .card { margin-left: calc(var(--overlap) * -1); }
.hand .card.playable { cursor: pointer; }
@media (hover: hover) { .hand .card.playable:hover { transform: translateY(-10px); } }
.hand .card.playable:focus-visible { transform: translateY(-10px); }
.hand .card.playable:active { transform: translateY(-6px); }
.hand .card.dim { filter: brightness(.55) saturate(.6); }
@media (prefers-reduced-motion: reduce) { .hand .card, .slot { transition: none; } }

/* ---------- Sprechblasen ---------- */
.bubble {
  position: absolute; z-index: 5; white-space: nowrap;
  background: var(--paper); color: var(--ink); font-weight: 700; font-size: 16px;
  border-radius: 10px; padding: 3px 10px; box-shadow: 0 3px 8px rgba(0,0,0,.4);
  pointer-events: none; animation: pop .18s ease-out;
}
.bubble.kontra { background: var(--red); color: #fff; }
.seat.n .bubble { top: 100%; margin-top: 4px; }
.seat.w .bubble { left: 100%; margin-left: 6px; top: 40%; }
.seat.e .bubble { right: 100%; margin-right: 6px; top: 40%; }
.seat.s .bubble { bottom: 100%; margin-bottom: 2px; }
@keyframes pop { from { transform: scale(.85); opacity: .3; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .bubble { animation: none; } }

/* ---------- Reiz-Panel / Dialoge ---------- */
.panel {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20;
  width: min(440px, calc(100% - 8px));
  background: var(--paper); color: var(--ink); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.55);
  padding: 14px 14px 12px; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 10px;
  max-height: calc(100% - 8px); overflow-y: auto; overscroll-behavior: contain;
}
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 24px; color: #6b1f22; text-wrap: balance; }
.panel .hint { font-size: 13px; color: #5d554b; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1.5px solid #cdbf9e; background: #fffdf6; color: var(--ink); border-radius: 7px;
  padding: 5px 9px; font-size: 15px; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums;
  display: inline-flex; align-items: center; gap: 5px;
}
.chip svg { width: 18px; height: 18px; }
.chip[aria-pressed="true"] { border-color: #6b1f22; background: #6b1f22; color: var(--paper); }
.row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.btn {
  border: none; border-radius: 7px; padding: 8px 16px; font-size: 15px; font-weight: 600; cursor: pointer;
  background: #1d4a38; color: var(--paper);
}
.btn.sec { background: #e8dfc8; color: var(--ink); }
.btn.kontra { background: var(--kontra, #b3262d); color: #fff; }
.btn.red { background: var(--red); color: #fff; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 4px; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #7a6f60; }

table.res { color: var(--ink); font-family: var(--f-body); width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
table.res th, table.res td { padding: 4px 6px; text-align: right; border-bottom: 1px solid #e3d8bf; }
table.res th:first-child, table.res td:first-child { text-align: left; }
table.res tr.tot td { font-weight: 700; border-bottom: none; border-top: 2px solid var(--ink); }
.verdict { font-size: 16px; font-weight: 600; }
.verdict.ok { color: #1d6b45; } .verdict.no { color: var(--red); }
.rules { max-height: min(62vh, 520px); overflow-y: auto; font-size: 14px; line-height: 1.45; }
.rules h3 { margin: 10px 0 2px; font-size: 15px; color: #6b1f22; }
.rules p, .rules ul { margin: 0 0 4px; }
.rules ul { padding-left: 18px; }
.scrim { position: absolute; inset: 0; background: rgba(8, 22, 16, .45); z-index: 19; }

/* ---------- Weis zeigen ---------- */
.weis-show {
  position: absolute; z-index: 15; pointer-events: none;
  background: rgba(10, 30, 22, .97); border: 1.5px solid var(--brass); border-radius: 10px;
  padding: 6px 8px 8px; display: flex; flex-direction: column; gap: 5px; align-items: center;
  box-shadow: 0 8px 22px rgba(0,0,0,.5); animation: wfade .2s ease-out; max-width: calc(100% - 8px);
}
@keyframes wfade { from { opacity: 0; } to { opacity: 1; } }
.weis-show .wh { font-size: 14px; color: var(--chalk); white-space: nowrap; }
.weis-show .wh b { color: var(--brass); }
.weis-show .wh .no { color: var(--chalk-dim); }
.weis-show .groups { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.weis-show .grp { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.weis-show .grp small { font-size: 11px; color: var(--chalk-dim); }
.weis-show .row { display: flex; }
.weis-show .mini { width: calc(var(--cw) * .62); height: calc(var(--cw) * .93); border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.weis-show .mini + .mini { margin-left: calc(var(--cw) * -.2); }
.weis-show .mini svg { width: 100%; height: 100%; display: block; }
.weis-show .bar { height: 3px; width: 100%; background: var(--brass); border-radius: 2px; transform-origin: left; animation: kdrain 3s linear forwards; }
.weis-show.p0 { left: calc(var(--cw) * .8); bottom: calc(var(--cw) * 1.85); }
.weis-show.p2 { left: 50%; top: calc(var(--cw) * .95); transform: translateX(-50%); }
.weis-show.p1 { right: calc(var(--cw) * .8); top: 38%; }
.weis-show.p3 { left: calc(var(--cw) * .8); top: 38%; }
@media (max-width: 640px) {
  .weis-show.p0, .weis-show.p1, .weis-show.p3, .weis-show.p2 { left: 50%; bottom: auto; right: auto; top: calc(var(--cw) * 2.05); transform: translateX(-50%); }
}
@media (prefers-reduced-motion: reduce) { .weis-show, .weis-show .bar { animation: none; } }

/* ---------- Handy hochkant (Klasse .ph): Hand in zwei Reihen, grosse Karten zum Antippen ---------- */
.ph #app { padding-block: 4px 6px; gap: 4px; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
.ph header { flex-wrap: nowrap; gap: 8px; }
.ph .brand h1 { font-size: 22px; }
.ph .brand .sub { display: none; }
.ph .tools { flex-direction: row; align-items: center; gap: 6px; }
.ph .ghost { padding: 3px 10px; font-size: 12px; }
.ph .tafel { border-width: 3px; padding: 2px 8px; column-gap: 10px; }
.ph .tafel .who { font-size: 14px; }
.ph .tafel .pts { font-size: 19px; }
.ph .tafel .goal { display: none; }
.ph .kontra-btn { margin-top: 3px; padding: 3px 6px; font-size: 12px; }
.ph .kontra-btn small { font-size: 10px; }
.ph .table { grid-template-columns: auto 1fr auto; gap: 3px; }
.ph .seat.n { flex-direction: row; justify-content: center; flex-wrap: wrap; gap: 6px; }
.ph .hand { flex-wrap: wrap; gap: 5px 4px; padding-top: 6px; }
.ph .hand .card + .card { margin-left: 0; }
.ph .contract { font-size: 13px; padding: 2px 10px; gap: 6px; }
.ph .status { font-size: 13px; }
.ph .name { font-size: 12px; }

/* ---------- Handy quer (Klasse .ls): Tafel rechts als Spalte, Tisch nutzt die volle Höhe ---------- */
.ph { --bw: calc(var(--cw) * .42); --tw: calc(var(--cw) * .82); }
.ls { --bw: calc(var(--cw) * .42); --tw: calc(var(--cw) * .78); }
/* Reiz- und Richtungsfenster auf dem Handy: oben am Tisch, die eigene Hand bleibt sichtbar */
.ph .panel.live, .ls .panel.live { top: 2px; transform: translateX(-50%); max-height: calc(var(--free, 100%) - 4px); padding: 9px 10px; gap: 6px; }
.ph .panel.live h2, .ls .panel.live h2 { font-size: 18px; }
.ph .panel.live .hint, .ls .panel.live .hint { font-size: 12.5px; }
.ph .panel.live .lx, .ls .panel.live .lx, .ls .panel.live .lbl { display: none; }
.ph .panel.live[aria-label="Reizen"] h2, .ph .panel.live .lbl { display: none; }
.ph .panel.live .hint { color: var(--ink); font-size: 13.5px; }
.ph .panel.live .chips, .ls .panel.live .chips { gap: 4px; }
.ph .panel.live .chip, .ls .panel.live .chip { padding: 4px 7px; font-size: 14px; min-height: 32px; }
.ph .panel.live .btn, .ls .panel.live .btn { padding: 7px 14px; }
.ph .panel.live .chips.modes { display: grid; grid-template-columns: repeat(4, 1fr); }
.ph .panel.live .chips.modes .chip { flex-direction: column; gap: 1px; padding: 4px 2px; font-size: 12.5px; line-height: 1.1; justify-content: center; }
.ph .seat.n .bubble, .ls .seat.n .bubble { top: 0; right: 2px; margin-top: 0; }
.ph .panel.live > .row, .ls .panel.live > .row { position: sticky; bottom: -9px; margin: 0 -10px -9px; padding: 6px 10px 9px; background: var(--paper); box-shadow: 0 -6px 10px -6px rgba(0,0,0,.25); }
.ls #app { grid-template-columns: 1fr auto; grid-template-rows: 1fr; max-width: none; padding-block: 4px; gap: 10px;
  padding-bottom: max(4px, env(safe-area-inset-bottom, 0px)); }
.ls header { order: 2; flex-direction: column; flex-wrap: nowrap; justify-content: flex-start; gap: 6px; width: 112px; }
.ls .brand h1 { font-size: 19px; }
.ls .brand .sub { display: none; }
.ls .tools { flex-direction: column-reverse; align-items: stretch; gap: 6px; }
.ls .tafel { border-width: 3px; padding: 2px 8px; column-gap: 8px; }
.ls .tafel .who { font-size: 13px; white-space: normal; line-height: 1.05; }
.ls .tafel .pts { font-size: 19px; }
.ls .kontra-btn { padding: 6px 4px; }
.ls .table { gap: 2px; grid-template-columns: auto 1fr auto; }
.ls .seat.n { flex-direction: row; justify-content: center; gap: 8px; }
.ls .hand { padding-top: 6px; }
.ls .contract { font-size: 13px; padding: 1px 10px; }
.ls .info { min-height: 22px; }
.ls .status { font-size: 13px; min-height: 18px; }
.ls .name { font-size: 12px; }
.ls .panel { width: min(600px, calc(100% - 8px)); padding: 10px 12px; gap: 7px; }
.ls .panel h2 { font-size: 20px; }
.ls .chip { padding: 4px 8px; font-size: 14px; }

/* ---------- Siegesfeier: Feuerwerk mit Namen ---------- */
.fw { position: fixed; inset: 0; z-index: 40; background: rgba(4, 10, 14, .78); cursor: pointer; animation: fwin .4s ease-out; }
.fw.out { opacity: 0; transition: opacity .6s ease; }
.fw canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.fw .cap {
  position: absolute; left: 0; right: 0; bottom: max(7%, calc(env(safe-area-inset-bottom, 0px) + 24px)); text-align: center;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none; color: var(--chalk); animation: fwcap 1s ease-out 2.6s both;
}
.fw .cap .t { font-family: var(--f-display); font-size: clamp(28px, 7vw, 56px); color: var(--brass); text-shadow: 0 0 18px rgba(216,165,49,.55); line-height: 1.05; text-wrap: balance; }
.fw .cap .s { font-family: var(--f-chalk); font-size: clamp(20px, 4.6vw, 30px); margin-top: 4px; }
