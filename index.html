      if (d.delay > 0) { d.delay--; continue; }
      d.x += (d.tx - d.x) * .09; d.y += (d.ty - d.y) * .09;
      cx.globalAlpha = .65 + .35 * Math.sin(frame * .15 + d.tw);
      cx.fillStyle = d.col; cx.beginPath(); cx.arc(d.x, d.y, dotR, 0, 7); cx.fill();
    }
    cx.globalAlpha = 1;
    if (el > 8500) finish(); else raf = requestAnimationFrame(tick);
  }
  function staticNames() {
    // Ohne Animation: Schriftzug direkt als Funkenpunkte zeichnen
    cx.clearRect(0, 0, W, H);
    for (const p of textTargets()) { cx.fillStyle = pick(['#d8a531', '#ffe08a']); cx.beginPath(); cx.arc(p.x, p.y, dotR, 0, 7); cx.fill(); }
  }
  function finish() {
    if (ended) return; ended = true;
    cancelAnimationFrame(raf); clearTimeout(skipT);
    box.classList.add('out');
    setTimeout(() => box.remove(), 600);
    done();
  }
  box.addEventListener('click', finish);
  let skipT = null;
  const go = () => { if (ended) return; if (reduce) { staticNames(); skipT = setTimeout(finish, 6000); } else raf = requestAnimationFrame(tick); };
  // Schrift für den Namenszug laden, bevor die Punkte abgetastet werden
  (document.fonts && document.fonts.load ? document.fonts.load("700 40px 'Grenze Gotisch'").catch(() => {}) : Promise.resolve()).then(go);
}

function later(fn, ms) { clearTimeout(timer); timer = setTimeout(fn, ms); }

// ---------- Ablauf ----------
function step() {
  render();
  if (modal) return;
  if (g.phase === 'gameOver' && !celebrated) { celebrated = true; celebrate(g.lastHand, () => { modal = 'result'; render(); }); return; }
  if (g.phase === 'handOver' || g.phase === 'gameOver') { modal = 'result'; render(); return; }
  if (g.phase === 'bidding') {
    if (g.turn === 0) return; // Reiz-Panel wartet auf dich; Kontra geht jederzeit über den Knopf
    later(() => { const p = g.turn; applyBid(p, AI.chooseBidAction(g, p)); }, 750);
    return;
  }
  if (lastKontraChance()) return;
  if (g.phase === 'direction') {
    if (g.turn === 0) return; // Richtungs-Panel wartet auf dich
    later(() => { const p = g.turn; applyDirection(p, AI.chooseDirection(g, p)); }, 900);
    return;
  }
  if (g.phase === 'play') {
    if (pausing) return;
    if (g.turn === 0) return;
    later(() => { const p = g.turn; playCard(p, AI.chooseCard(g, p, { samples: 40 })); }, 650);
  }
}

// Gebote nennen bei Slalom/Quer keine Richtung
const BID_NAME = m => J.bidModeName(m);
function bidText(a) { return a.amount + ' ' + BID_NAME(a.mode); }

// Kontra ist jederzeit möglich, solange das Gegner-Gebot das höchste ist (v22) – auch nach dem eigenen Passen
// und nach dem Reizen bis zur ersten Karte. Nach dem Reizen fragt das Spiel dich einmal ausdrücklich,
// damit niemand unter Zeitdruck entscheiden muss.
let kontraAsk = -1;      // handNo, für die die Schlussfrage schon erledigt ist
let kontraAskOpen = false;
let kontraAiChecked = -1;
function lastKontraChance() {
  if (g.phase !== 'direction' && g.phase !== 'play') return false;
  if (g.tricks.length || g.trick.length || g.kontra || kontraAsk === g.handNo) return false;
  // Nach dem Reizen: Die KI-Gegner entscheiden jetzt, ob ihre Karten ein Kontra rechtfertigen
  // (im Reizen warten sie damit, solange ihr Team selbst noch reizen könnte)
  if (kontraAiChecked !== g.handNo) {
    kontraAiChecked = g.handNo;
    for (const p of [1, 2, 3]) if (g.canKontra(p) && AI.chooseKontra(g, p)) { kontraAsk = g.handNo; applyBid(p, { type: 'kontra' }); return true; }
  }
  if (!g.canKontra(0)) { kontraAsk = g.handNo; return false; }
  kontraAskOpen = true; render();
  return true;
}
function answerKontra(yes) {
  kontraAsk = g.handNo; kontraAskOpen = false;
  if (yes && g.canKontra(0)) { applyBid(0, { type: 'kontra' }); return; }
  render(); step();
}
function humanBid(a) { applyBid(0, a); }

function applyBid(p, a) {
  const hand = g.handNo;
  g.act(p, a);
  if (p === 0) clearTimeout(timer);
  // Gebote und Pässe stehen dauerhaft als Plakette beim Sitz; nur Kontra bekommt eine Sprechblase
  if (a.type === 'kontra') say(p, 'Kontra!', { kontra: true, ms: 2200 });
  selAmount = null; selMode = null;
  if (g.handNo !== hand) {
    statusMsg = 'Alle haben gepasst. Es wird neu gegeben.';
    clearBubbles();
    render();
    later(step, 1200);
    return;
  }
  if (g.phase === 'play') { startPlayAnnouncements(); return; }
  step();
}

function applyDirection(p, a) {
  g.act(p, a);
  say(p, MODE_NAMES[g.mode], { ms: 2600 });
  startPlayAnnouncements();
}

function startPlayAnnouncements() {
  // Weis wird beim Ausspielen der ersten Karte angesagt und nach dem ersten Stich gezeigt
  statusMsg = '';
  pausing = true;
  render();
  later(() => { pausing = false; step(); }, 500);
}

// Karten eines Weises aus der Engine-Beschreibung ableiten
function weisCards(w) {
  if (w.kind === 'vier') return [0, 1, 2, 3].map(s => J.makeCard(s, w.top));
  const cs = [];
  for (let r = w.top; r > w.top - w.n; r--) cs.push(J.makeCard(w.suit, r));
  return cs;
}
let weisShown = null;    // {p, list, counts}
const WEIS_MS = 3000;
// Weis-Ablauf wie am Tisch:
// 1. Beim Ausspielen der ersten Karte wird der Weis nur angesagt («Weis 20»).
// 2. Nach der vierten Karte des ersten Stichs legt NUR der Spieler mit dem höchsten Weis offen (3 Sekunden).
//    Sein Team schreibt dazu auch den Weis des Partners.
function announceWeis(p, ev) {
  const firstTrick = ev.trickComplete ? g.tricks.length === 1 : g.tricks.length === 0;
  if (!firstTrick || !g.weis) return;
  const list = g.weis.perPlayer[p];
  if (list && list.length) say(p, 'Weis ' + list.reduce((a, w) => a + w.value, 0), { ms: 2200 });
}
function bestWeisPlayer() {
  // gleiche Reihenfolge wie die Engine: ab dem Spieler, der den ersten Stich ausgespielt hat
  const order = [0, 1, 2, 3].map(i => (g.declarer + i) % 4);
  let bestP = -1, bestW = null;
  for (const p of order) {
    const w = J.bestWeis(g.weis.perPlayer[p]);
    if (w && (!bestW || J.compareWeis(w, bestW) > 0)) { bestW = w; bestP = p; }
  }
  return bestP;
}
function maybeShowWeis(p, ev) {
  if (!ev.trickComplete || g.tricks.length !== 1 || !g.weis || g.weis.winnerTeam < 0) return false;
  const bp = bestWeisPlayer();
  if (bp < 0) return false;
  const t = J.team(bp);
  weisShown = { p: bp, list: g.weis.perPlayer[bp], teamPts: g.weis.pts[t], partnerPts: g.weis.perPlayer[(bp + 2) % 4].reduce((a, w) => a + w.value, 0) };
  return true;
}
function renderWeis() {
  const el = $('weisShow');
  if (!weisShown) { el.innerHTML = ''; return; }
  const { p, list, teamPts, partnerPts } = weisShown;
  const total = list.reduce((a, w) => a + w.value, 0);
  const label = w => w.kind === 'vier' ? `4 ${J.RANKS[w.top]}` : `${w.n} Blatt`;
  el.innerHTML = `<div class="weis-show p${p}" role="status">
    <div class="wh">${esc(NAMES[p])} ${p === 0 ? 'hast' : 'hat'} den höchsten Weis: <b>${total}</b></div>
    <div class="groups">${list.map(w => `<div class="grp"><div class="row">${weisCards(w).map(c => `<div class="mini">${cardSVG(c)}</div>`).join('')}</div><small>${label(w)} · ${w.value}</small></div>`).join('')}</div>
    <div class="wh">${esc(teamName(J.team(p)))} schreiben <b>${teamPts}</b>${partnerPts ? ` <span class="no">(inkl. ${partnerPts} von ${esc(NAMES[(p + 2) % 4])})</span>` : ''}</div>
    <div class="bar"></div></div>`;
}

function playCard(p, c) {
  if (trickWinner >= 0) { shownTrick = []; trickWinner = -1; }
  const ev = g.play(p, c);
  shownTrick = ev.trickComplete ? ev.trickComplete.cards : g.trick.slice();
  // Stöck ansagen, wenn das zweite Stöck-Blatt fällt
  if (g.stoeck === p && J.isTrumpMode(g.mode) && (J.rankOf(c) === J.RK || J.rankOf(c) === J.RO) && J.suitOf(c) === g.mode) {
    const other = J.makeCard(g.mode, J.rankOf(c) === J.RK ? J.RO : J.RK);
    if (!g.hands[p].includes(other)) say(p, 'Stöck!');
  }
  statusMsg = '';
  announceWeis(p, ev);
  const showWeis = maybeShowWeis(p, ev);
  if (showWeis) {
    // Spiel 3 Sekunden anhalten, damit der Weis gesehen wird
    pausing = true;
    trickWinner = ev.trickComplete.winner;
    statusMsg = `${NAMES[trickWinner]} ${trickWinner === 0 ? 'machst' : 'macht'} den Stich (${ev.trickComplete.cards.reduce((a, x) => a + J.points(x.c, g.mode), 0)} Punkte)`;
    render();
    later(() => {
      weisShown = null;
      if (ev.trickComplete) { shownTrick = []; trickWinner = -1; }
      pausing = false; statusMsg = '';
      step();
    }, WEIS_MS);
    return;
  }
  if (ev.trickComplete) {
    trickWinner = ev.trickComplete.winner;
    pausing = true;
    statusMsg = `${NAMES[trickWinner]} ${trickWinner === 0 ? 'machst' : 'macht'} den Stich (${ev.trickComplete.cards.reduce((a, x) => a + J.points(x.c, g.mode), 0)} Punkte)`;
    render();
    later(() => {
      pausing = false; shownTrick = []; trickWinner = -1; statusMsg = '';
      step();
    }, 1250);
    return;
  }
  step();
}

// ---------- Darstellung ----------
const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

function render() {
  renderTeams();
  $('sA').textContent = g.scores[0];
  $('sB').textContent = g.scores[1];
  renderInfo();
  renderSeats();
  renderCenter();
  renderStatus();
  renderOverlay();
  renderKontra();
  renderWeis();
}

function renderKontra() {
  const b = $('kontraBtn');
  const live = g.canKontra(0) && !modal;
  b.disabled = !live;
  b.classList.remove('timed');
  const hb = g.highBid;
  b.innerHTML = live ? `Kontra!<small>gegen ${NAMES[hb.p]} ${bidText(hb)}</small>` : 'Kontra<small>bei Gegner-Gebot</small>';
}

function renderInfo() {
  let html = '';
  if (g.phase === 'bidding' || g.phase === 'kontra') {
    const hb = g.highBid;
    html = `<span class="contract">Geber: ${NAMES[g.dealer]} · ${hb ? `Höchstes Gebot: <b>${hb.amount}</b> ${bidModeIcon(hb.mode)} ${BID_NAME(hb.mode)} von ${NAMES[hb.p]}` : 'Noch kein Gebot'}</span>`;
  } else if (g.declarer !== undefined && g.phase !== 'bidding') {
    let dir = '';
    if (g.mode >= 6 && g.phase === 'play') {
      // Slalom/Quer: Richtung des laufenden Stichs gut sichtbar anzeigen
      const n = g.tricks.length, d = g.currentTrickMode();
      const flip = n > 0 && J.trickMode(g.mode, n - 1) !== d;
      dir = ` <span class="dir${flip ? ' flip' : ''}">Stich ${n + 1}: ${modeIcon(d)} ${MODE_NAMES[d]}</span>`;
    }
    const open = g.phase === 'direction';   // Richtung noch nicht gewählt: nur «Slalom»/«Quer» zeigen
    html = `<span class="contract">${NAMES[g.declarer]} ${g.declarer === 0 ? 'spielst' : 'spielt'} <b>${g.bid}</b> ${open ? bidModeIcon(g.mode) : modeIcon(g.mode)} ${open ? BID_NAME(g.mode) : MODE_NAMES[g.mode]} ${X(g.mode)}${g.kontra ? ` <span class="k">Kontra von ${NAMES[g.kontraBy]}</span>` : ''}${dir}</span>`;
  }
  $('info').innerHTML = html;
}

function renderSeats() {
  for (let p = 0; p < 4; p++) {
    const el = $('seat' + p);
    const isTurn = g.turn === p && (g.phase === 'bidding' || g.phase === 'kontra' || g.phase === 'direction' || g.phase === 'play') && !pausing;
    const tag = p === 2 ? '<span class="tag">Partner</span>' : '';
    const decl = g.phase === 'play' && g.declarer === p ? '<span class="tag">Spieler</span>' : '';
    const name = `<div class="name${isTurn ? ' turn' : ''}">${NAMES[p]}${tag}${decl}</div>`;
    const b = bubbles[p] ? `<div class="bubble${bubbles[p].kontra ? ' kontra' : ''}">${esc(bubbles[p].text)}</div>` : '';
    const call = callHTML(p);
    if (p === 0) {
      el.innerHTML = b + handHTML() + `<div style="display:flex;gap:8px;align-items:center">${name}${call}</div>`;
    } else {
      const n = g.hands[p].length;
      const v = p !== 2;
      el.innerHTML = name + call + `<div class="backs${v ? ' v' : ''}" aria-label="${n} Karten">${'<div class="back"></div>'.repeat(n)}</div>` + b;
    }
  }
  layout();
}

// Letzte Ansage eines Sitzes, sichtbar bis das Reizen endet
const X = m => `<span class="x">×${J.MULT[m]}</span>`;

function callHTML(p) {
  if (g.phase !== 'bidding' && g.phase !== 'kontra') return '';
  let last = null;
  for (const e of g.bidLog) if (e.p === p) last = e;
  if (!last) return '';
  if (last.type === 'pass') return '<div class="call pass">Passe</div>';
  if (last.type === 'kontra') return '<div class="call kontra">Kontra</div>';
  const hi = g.highBid && g.highBid.p === p && g.highBid.amount === last.amount;
  return `<div class="call${hi ? ' hi' : ''}">${last.amount} ${bidModeIcon(last.mode)} ${BID_NAME(last.mode)} ${X(last.mode)}</div>`;
}

function handHTML() {
  // Feste Reihenfolge, unabhängig von Trumpf und Richtung: Schellen, Schilten, Eicheln, Rosen, je Ass bis 6
  const hand = J.sortHand(g.hands[0]);
  const myTurn = g.phase === 'play' && g.turn === 0 && !pausing && !modal;
  const legal = myTurn ? g.legal(0) : [];
  return `<div class="hand" id="hand">${hand.map(c => {
    const ok = legal.includes(c);
    const cls = myTurn ? (ok ? ' playable' : ' dim') : '';
    return `<button class="card${cls}" data-c="${c}" ${ok ? '' : 'tabindex="-1"'} aria-label="${J.cardName(c)}">${cardSVG(c)}</button>`;
  }).join('')}</div>`;
}

// Kartengrösse an den Bildschirm anpassen: Breite gibt den Startwert, dann wird verkleinert,
// bis die eigene Hand ganz sichtbar ist. Handy hochkant (.ph) und Handy quer (.ls) haben eigene Layouts.
function layout() {
  const root = document.documentElement, W = window.innerWidth, H = window.innerHeight;
  const ph = W <= 600 && H > W, ls = !ph && H <= 520 && W > H;
  root.classList.toggle('ph', ph); root.classList.toggle('ls', ls);
  const table = $('table'), app = $('app'), me = $('seat0');
  if (!table || !me) return;
  const tw = table.getBoundingClientRect().width;
  let cw = ph ? Math.min(92, Math.floor((tw - 4 * 4 - 2) / 5))
         : ls ? Math.min(86, Math.floor((tw - 8) / 9.3))
         : Math.max(46, Math.min(82, W * .115));
  const apply = () => { root.style.setProperty('--cw', cw + 'px'); fitHand(); };
  apply();
  const limit = () => Math.min(app.getBoundingClientRect().bottom, window.innerHeight) - 1;
  while (cw > 34 && me.getBoundingClientRect().bottom > limit()) { cw -= 2; apply(); }
  const hand = $('hand') || me;
  root.style.setProperty('--free', Math.max(140, hand.getBoundingClientRect().top - table.getBoundingClientRect().top) + 'px');
}

function fitHand() {
  const hand = $('hand');
  if (!hand) return;
  const n = hand.children.length;
  if (n < 2 || document.documentElement.classList.contains('ph')) { document.documentElement.style.setProperty('--overlap', '0px'); return; }
  const cw = hand.children[0].getBoundingClientRect().width;
  const avail = $('table').getBoundingClientRect().width - 4;
  const step = Math.min(cw + 4, (avail - cw) / (n - 1));
  document.documentElement.style.setProperty('--overlap', Math.max(0, cw - step) + 'px');
}

function renderCenter() {
  $('center').innerHTML = shownTrick.map(x =>
    `<div class="slot p${x.p}${x.p === trickWinner ? ' win' : ''}"><div class="card">${cardSVG(x.c)}</div></div>`).join('');
}

function renderStatus() {
  let msg = statusMsg;
  if (!msg) {
    if (kontraAskOpen) msg = `<em>Das Reizen ist vorbei.</em> Kontra oder nicht?`;
    else if (g.phase === 'bidding' && g.turn !== 0) msg = `${NAMES[g.turn]} überlegt …`;
    else if (g.phase === 'direction' && g.turn !== 0) msg = `${NAMES[g.turn]} wählt die Startrichtung …`;
    else if (g.phase === 'play' && !pausing) msg = g.turn === 0 ? '<em>Du bist am Zug.</em> Wähle eine helle Karte.' : `${NAMES[g.turn]} ist am Zug …`;
  }
  $('status').innerHTML = msg;
}

function renderOverlay() {
  const o = $('overlay');
  if (modal === 'rules') { o.innerHTML = '<div class="scrim"></div>' + rulesHTML(); return; }
  if (modal === 'result') { o.innerHTML = '<div class="scrim"></div>' + resultHTML(); return; }
  if (g.phase === 'direction' && g.turn === 0) { o.innerHTML = directionPanelHTML(); return; }
  if (kontraAskOpen && g.canKontra(0)) { o.innerHTML = kontraAskHTML(); return; }
  if (g.phase === 'bidding' && g.turn === 0) { o.innerHTML = bidPanelHTML(); return; }
  o.innerHTML = '';
}

function kontraAskHTML() {
  const hb = g.highBid;
  return `<div class="panel live" role="dialog" aria-label="Kontra">
    <h2>Kontra?</h2>
    <p class="hint">${NAMES[hb.p]} spielt <b>${bidText(hb)}</b>. Du kannst noch Kontra geben, bis die erste Karte gespielt ist. Mit Kontra zählt das Gebot doppelt.</p>
    <div class="row">
      <button class="btn sec" data-act="nokontra-ask">Kein Kontra</button>
      <button class="btn kontra" data-act="kontra-ask">Kontra!</button>
    </div></div>`;
}

function directionPanelHTML() {
  const quer = g.mode === 8;
  return `<div class="panel live" role="dialog" aria-label="Startrichtung">
    <h2>${BID_NAME(g.mode)} – womit beginnst du?</h2>
    <p class="hint">Du hast ${g.bid} ${BID_NAME(g.mode)} bekommen${g.kontra ? ` (Kontra von ${NAMES[g.kontraBy]})` : ''}. ${quer ? 'Die ersten 4 Stiche gehen in die Startrichtung, die letzten 5 in die Gegenrichtung.' : 'Die Richtung wechselt jeden Stich.'} Die Startrichtung bestimmt auch die Kartenwerte: mit Obenabe zählen die Asse, mit Undenufe die Sechser.</p>
    <div class="row" style="justify-content:stretch">
      <button class="btn" style="flex:1" data-act="dir-oben">${modeIcon(4)} Obenabe zuerst</button>
      <button class="btn" style="flex:1" data-act="dir-unten">${modeIcon(5)} Undenufe zuerst</button>
    </div></div>`;
}

function bidPanelHTML() {
  const hb = g.highBid;
  const allowed = g.allowedBids();
  if (selAmount !== null && !allowed.includes(selAmount)) selAmount = null;
  const canBid = selAmount !== null && selMode !== null;
  return `<div class="panel live" role="dialog" aria-label="Reizen">
    <h2>${hb ? 'Überbieten oder passen' : 'Dein Gebot'}</h2>
    <p class="hint">${hb ? `Höchstes Gebot: <b>${bidText(hb)}</b> von ${NAMES[hb.p]}${J.team(hb.p) === 0 && hb.p !== 0 ? ' (dein Partner)' : ''}.` : '<span class="lx">Wie viele Kartenpunkte macht ihr zu zweit? </span>Maximum 157, Match 257.'}${g.canKontra(0) ? '<span class="lx"> Kontra geht jederzeit über den roten Knopf an der Tafel.</span>' : ''}</p>
    <div class="lbl">Punkte</div>
    <div class="chips">${allowed.map(b => `<button class="chip" data-amt="${b}" aria-pressed="${selAmount === b}">${b}</button>`).join('')}</div>
    <div class="lbl">Spielart<span class="lx"> · Kartenpunkte, Weis und Stöck zählen mit dem Faktor</span></div>
    <div class="chips modes">${J.BID_MODES.map(m => `<button class="chip" data-mode="${m}" aria-pressed="${selMode === m}">${bidModeIcon(m)}${BID_NAME(m)} ${X(m)}</button>`).join('')}</div>
    <div class="row">
      <button class="btn sec" data-act="pass">Passen</button>
      <button class="btn" data-act="bid" ${canBid ? '' : 'disabled'}>${canBid ? 'Reize ' + selAmount + ' ' + BID_NAME(selMode) : 'Reizen'}</button>
    </div></div>`;
}

function resultHTML() {
  const r = g.lastHand;
  const over = g.phase === 'gameOver';
  const dn = NAMES[r.declarer];
  const sub = [0, 1].map(t => r.cardPts[t] + r.weisPts[t] + r.stoeckPts[t]);
  const rows = [
    ['Kartenpunkte', r.cardPts], ['Weis', r.weisPts], ['Stöck', r.stoeckPts],
    [`<b>× ${r.mult}</b> ${MODE_NAMES[r.mode]}`, sub.map(x => `<b>${x * r.mult}</b>`)],
    ['Gebot' + (r.kontra ? ` (Kontra von ${NAMES[g.kontraBy]}, ×2)` : '') + ' <small>ohne Faktor</small>', r.made ? [J.team(r.declarer) === 0 ? r.bonus : 0, J.team(r.declarer) === 1 ? r.bonus : 0] : [J.team(r.declarer) === 1 ? r.bonus : 0, J.team(r.declarer) === 0 ? r.bonus : 0]],
  ];
  let head = over
    ? `<h2>${r.gameWinner === 0 ? 'Gewonnen!' : 'Verloren.'}</h2><p class="hint">${r.gameWinner === 0 ? 'Du und ' + NAMES[2] : NAMES[1] + ' und ' + NAMES[3]} gewinnen ${r.scores[r.gameWinner]} zu ${r.scores[1 - r.gameWinner]}${r.doppel ? ', und zwar doppelt, weil der Verlierer unter 2500 blieb' : ''}.</p>`
    : `<h2>Spiel ${g.handNo} abgerechnet</h2>`;
  return `<div class="panel" role="dialog" aria-label="Abrechnung">${head}
    <div class="verdict ${r.made ? 'ok' : 'no'}">${dn} ${r.declarer === 0 ? 'hast' : 'hat'} ${r.bid} ${MODE_NAMES[r.mode]} ${r.made ? 'erfüllt' : 'verfehlt'}${r.match >= 0 ? ' · Match!' : ''}</div>
    <table class="res"><thead><tr><th></th><th>${esc(teamName(0))}</th><th>${esc(teamName(1))}</th></tr></thead><tbody>
    ${rows.map(([l, v]) => `<tr><td>${l}</td><td>${v[0]}</td><td>${v[1]}</td></tr>`).join('')}
    <tr class="tot"><td>Dieses Spiel</td><td>${r.total[0]}</td><td>${r.total[1]}</td></tr>
    <tr><td>Stand</td><td>${r.scores[0]}</td><td>${r.scores[1]}</td></tr></tbody></table>
    <div class="row"><button class="btn sec" data-act="rules">Regeln</button><button class="btn" data-act="${over ? 'newgame' : 'next'}">${over ? 'Neue Partie' : 'Nächstes Spiel'}</button></div></div>`;
}

function rulesHTML() {
  return `<div class="panel" role="dialog" aria-label="Regeln"><h2>Kurzregeln</h2><div class="rules">
    <h3>Ziel</h3><p>Du spielst mit ${NAMES[2]} (gegenüber) gegen ${NAMES[1]} (rechts) und ${NAMES[3]} (links). Mit jeder neuen Partie wechselt die Besetzung. Wer zuerst 5000 Punkte hat, gewinnt. Gespielt wird gegen den Uhrzeigersinn.</p>
    <h3>Reizen</h3><p>Ab 40 in Zehnerschritten bis 150, dann 157 (alle Punkte) oder 257 (Match). Wer am höchsten reizt, bestimmt Trumpf, Obenabe oder Undenufe und spielt aus.</p><h3>Kontra</h3><p>Kontra geben nur die Gegner des Höchstbietenden, nie der eigene Partner. Solange das Gebot der Gegner das höchste ist, leuchtet der rote Kontra-Knopf an der Tafel – ohne Zeitlimit, auch wenn du schon gepasst hast, und nach dem Reizen bis zur ersten Karte. Nach dem Reizen fragt dich das Spiel noch einmal. Mit Kontra zählt der Gebotswert doppelt; im Reizen endet das Reizen damit sofort. Haben du und dein Partner dieselbe Farbe gesagt, reizt der Partner lieber diese weiter, statt Kontra zu geben.</p>
    <h3>Slalom und Quer</h3><p>Slalom: Die Richtung wechselt jeden Stich zwischen Obenabe und Undenufe. Quer: Die ersten 4 Stiche gehen in die Startrichtung, die letzten 5 in die Gegenrichtung. Gereizt wird nur «Slalom» oder «Quer»; die Startrichtung wählt erst, wer das Spiel bekommt. Oben in der Mitte steht immer, welche Richtung im laufenden Stich gilt.</p>
    <h3>Kartenwerte</h3><ul><li>Trumpf: Under (Puur) 20, Nell 14, Ass 11, Banner 10, König 4, Ober 3</li><li>Andere Farben: Ass 11, Banner 10, König 4, Ober 3, Under 2</li><li>Obenabe: wie andere Farben, dazu die 8 mit 8 Punkten</li><li>Undenufe: 6 zählt 11, Ass 0, die 8 zählt 8; die 6 ist die höchste Karte</li><li>Slalom und Quer: gezählt wird nach der Startrichtung (Start Obenabe: Asse zählen; Start Undenufe: Sechser zählen)</li><li>Letzter Stich 5, alle Stiche +100</li></ul>
    <h3>Zugeben</h3><ul><li>Farbe bedienen oder trumpfen. Wer die Farbe nicht hat, spielt frei.</li><li>Bei Trumpf-Ausspiel muss Trumpf kommen. Ausnahme: der Puur allein muss nie zugegeben werden.</li><li>Untertrumpfen ist verboten, ausser man hat nur noch Trümpfe.</li></ul>
    <h3>Weis und Stöck</h3><p>Weis wird automatisch angesagt: Dreierfolge 20, Viererfolge 50, ab fünf 100, vier Gleiche 100 (auch 6, 7, 8), vier Näll 150, vier Under 200. Nur das Team mit dem besten Weis schreibt. König und Ober im Trumpf geben 20 (Stöck). Beides zählt nicht für das Gebot.</p>
    <p>Beim Ausspielen der ersten Karte wird der Weis angesagt. Nach dem ersten Stich legt nur der Spieler mit dem höchsten Weis offen; sein Team schreibt auch den Weis des Partners. Bei gleichem Wert gewinnt die Reihe vor vier Gleichen, dann die höhere Karte, dann der Weis in der Trumpffarbe, dann wer zuerst ausgespielt hat.</p>
    <h3>Faktoren</h3><p>Eicheln ×1, Schellen und Schilten ×2, Obenabe und Undenufe ×3, Slalom und Quer ×4, Rosen ×5. Mit dem Faktor zählen Kartenpunkte, Weis und Stöck beider Teams. Gebot und Kontra zählen ohne Faktor.</p>
    <h3>Abrechnung</h3><p>Beide Teams schreiben ihre Punkte mal Faktor. Erfüllt das Spielerteam sein Gebot mit den einfachen Kartenpunkten, erhält es den Gebotswert dazu, sonst bekommen ihn die Gegner.</p>
    </div><div class="row"><button class="btn" data-act="closerules">Zurück</button></div></div>`;
}

// ---------- Eingaben ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.c !== undefined && t.classList.contains('playable')) {
    playCard(0, +t.dataset.c);
    return;
  }
  if (t.dataset.amt) { selAmount = +t.dataset.amt; renderOverlay(); return; }
  if (t.dataset.mode) { selMode = +t.dataset.mode; renderOverlay(); return; }
  const act = t.dataset.act;
  if (!act) return;
  if (act === 'pass') humanBid({ type: 'pass' });
  else if (act === 'bid' && selAmount !== null && selMode !== null) humanBid({ type: 'bid', amount: selAmount, mode: selMode });
  else if (act === 'kontra') { if (g.canKontra(0)) { if (kontraAskOpen) answerKontra(true); else applyBid(0, { type: 'kontra' }); } }
  else if (act === 'kontra-ask') answerKontra(true);
  else if (act === 'nokontra-ask') answerKontra(false);
  else if (act === 'dir-oben' || act === 'dir-unten') { if (g.phase === 'direction' && g.turn === 0) applyDirection(0, { type: 'direction', dir: act === 'dir-oben' ? 'oben' : 'unten' }); }
  else if (act === 'next') { modal = null; weisShown = null; g.nextHand(); shownTrick = []; statusMsg = ''; clearBubbles(); step(); }
  else if (act === 'newgame') newGame();
  else if (act === 'rules') { modal = 'rules'; renderOverlay(); }
  else if (act === 'closerules') {
    modal = (g.phase === 'handOver' || g.phase === 'gameOver') ? 'result' : null;
    if (pausing) { pausing = false; shownTrick = []; trickWinner = -1; statusMsg = ''; }
    render(); step();
  }
});
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

// Regeln-Knopf im Kopf
const tools = document.querySelector('.tools');
const rb = document.createElement('button');
rb.className = 'ghost'; rb.id = 'rulesBtn'; rb.textContent = 'Regeln';
rb.addEventListener('click', () => { modal = 'rules'; clearTimeout(timer); renderOverlay(); renderKontra(); });
tools.prepend(rb);

// ---------- Live-Update: laufende Partie erhalten ----------
function snapshot() {
  const o = {};
  for (const k of Object.keys(g)) if (k !== 'rnd') o[k] = g[k];
  return { g: JSON.parse(JSON.stringify(o)), names: NAMES.slice() };
}
function start(data) {
  if (data && data.g) {
    if (data.names) NAMES = data.names;
    g = Object.assign(Object.create(J.Game.prototype), data.g);
    g.rnd = Math.random;
    shownTrick = []; trickWinner = -1; pausing = false; modal = null;
    step();
  } else newGame();
}
window.claude?.hot?.snapshot?.(snapshot);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
