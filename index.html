<script>/* Sidi Barrani – Spiel-Engine (reine Logik, keine Grafik). Siehe spec.md */
(function (root) {
  'use strict';

  // ---------- Karten ----------
  const SUITS = ['Schellen', 'Schilten', 'Eicheln', 'Rosen'];
  // Natürliche Rangindizes tief -> hoch
  const RANKS = ['6', '7', '8', '9', 'Banner', 'Under', 'Ober', 'König', 'Ass'];
  const R6 = 0, R7 = 1, R8 = 2, R9 = 3, RB = 4, RU = 5, RO = 6, RK = 7, RA = 8;
  const MODES = ['Schellen', 'Schilten', 'Eicheln', 'Rosen', 'Obenabe', 'Undenufe',
    'Slalom Obenabe', 'Slalom Undenufe', 'Quer Obenabe', 'Quer Undenufe'];
  const OBENABE = 4, UNDENUFE = 5, SLALOM_OBEN = 6, SLALOM_UNTEN = 7, QUER_OBEN = 8, QUER_UNTEN = 9;
  const NUM_MODES = 10;
  // Slalom: Richtung wechselt jeden Stich. Quer: 4 Stiche Startrichtung, dann 5 in der Gegenrichtung.
  // Die Startrichtung bestimmt die Kartenwerte für das ganze Spiel (Summe bleibt 157).
  function startDir(m) { return (m === SLALOM_OBEN || m === QUER_OBEN) ? OBENABE : UNDENUFE; }
  function trickMode(m, n) {          // Richtung des Stichs n (0..8)
    if (m < 6) return m;
    const s = startDir(m), o = s === OBENABE ? UNDENUFE : OBENABE;
    if (m === SLALOM_OBEN || m === SLALOM_UNTEN) return n % 2 === 0 ? s : o;
    return n < 4 ? s : o;
  }
  function pointsMode(m) { return m < 6 ? m : startDir(m); }
  // Reizen (v17): Bei Slalom und Quer wird nur die Spielart gereizt, nicht die Richtung.
  // Gebots-Codes: 6 = Slalom, 8 = Quer (7 und 9 sind keine gültigen Gebote). Die Startrichtung wählt der
  // Spieler erst nach dem Reizen (Phase 'direction'): Slalom -> 6 (Obenabe) / 7 (Undenufe), Quer -> 8 / 9.
  const BID_MODES = [0, 1, 2, 3, 4, 5, SLALOM_OBEN, QUER_OBEN];
  const BID_MODE_NAMES = { 6: 'Slalom', 8: 'Quer' };
  function bidModeName(m) { return BID_MODE_NAMES[m] || MODES[m]; }
  function isOpenDirection(m) { return m === SLALOM_OBEN || m === QUER_OBEN; }
  const BID_LEVELS = [40, 50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150, 157, 257];
  const TARGET = 5000;
  // Faktor je Spielart (v16): Kartenpunkte, Weis und Stöck werden multipliziert, Gebot und Kontra nicht.
  // Schellen ×2, Schilten ×2, Eicheln ×1, Rosen ×5, Obenabe/Undenufe ×3, Slalom/Quer ×4
  const MULT = [2, 2, 1, 5, 3, 3, 4, 4, 4, 4];

  const suitOf = c => Math.floor(c / 9);
  const rankOf = c => c % 9;
  const makeCard = (s, r) => s * 9 + r;
  const isTrumpMode = m => m >= 0 && m <= 3;
  const isTrump = (c, m) => isTrumpMode(m) && suitOf(c) === m;
  const team = p => p % 2;
  const nextP = p => (p + 1) % 4;
  const cardName = c => SUITS[suitOf(c)] + ' ' + RANKS[rankOf(c)];

  // Punkte einer Karte im Modus m
  const NONTRUMP_PTS = [0, 0, 0, 0, 10, 2, 3, 4, 11];
  const TRUMP_PTS = [0, 0, 0, 14, 10, 20, 3, 4, 11];
  const OBEN_PTS = [0, 0, 8, 0, 10, 2, 3, 4, 11];
  const UNDEN_PTS = [11, 0, 8, 0, 10, 2, 3, 4, 0]; // Undenufe: 6 zählt 11, Ass 0
  function points(c, m) {
    m = pointsMode(m);
    const r = rankOf(c);
    if (m === OBENABE) return OBEN_PTS[r];
    if (m === UNDENUFE) return UNDEN_PTS[r];
    if (suitOf(c) === m) return TRUMP_PTS[r];
    return NONTRUMP_PTS[r];
  }

  // Trumpf-Stärke (höher = besser): U > 9 > A > K > O > B > 8 > 7 > 6
  const TRUMP_ORDER = [0, 1, 2, 7, 3, 8, 4, 5, 6]; // index = natürlicher Rang
  function trumpStrength(c) { return TRUMP_ORDER[rankOf(c)]; }
  // Stärke innerhalb der Farbe für Nicht-Trumpf/Obenabe (natürlich) bzw. Undenufe (umgekehrt)
  function plainStrength(c, m) { return m === UNDENUFE ? 8 - rankOf(c) : rankOf(c); }

  // Gewinner eines Stichs. trick = [{p, c}, ...] in Ausspielreihenfolge
  function trickWinnerIndex(trick, m) {
    const led = suitOf(trick[0].c);
    let best = 0;
    for (let i = 1; i < trick.length; i++) {
      if (beats(trick[i].c, trick[best].c, led, m)) best = i;
    }
    return best;
  }
  // Schlägt Karte a die bisher beste Karte b?
  function beats(a, b, led, m) {
    const ta = isTrump(a, m), tb = isTrump(b, m);
    if (ta && !tb) return true;
    if (!ta && tb) return false;
    if (ta && tb) return trumpStrength(a) > trumpStrength(b);
    if (suitOf(a) !== suitOf(b)) return false; // abgeworfen
    return plainStrength(a, m) > plainStrength(b, m);
  }

  // Legale Züge (spec §6)
  function legalMoves(hand, trick, m) {
    if (trick.length === 0) return hand.slice();
    const led = suitOf(trick[0].c);
    const ofLed = hand.filter(c => suitOf(c) === led);
    if (!isTrumpMode(m)) return ofLed.length ? ofLed : hand.slice();

    const T = m;
    const trumps = hand.filter(c => suitOf(c) === T);
    if (led === T) {
      const onlyPuur = trumps.length === 1 && rankOf(trumps[0]) === RU;
      if (trumps.length === 0 || onlyPuur) return hand.slice();
      return trumps;
    }
    // Nicht-Trumpf ausgespielt
    let highestTrumpInTrick = -1;
    for (const t of trick) if (suitOf(t.c) === T) highestTrumpInTrick = Math.max(highestTrumpInTrick, trumpStrength(t.c));
    const allTrumps = trumps.length === hand.length;
    const trumpAllowed = c => highestTrumpInTrick < 0 || allTrumps || trumpStrength(c) > highestTrumpInTrick;
    let cand = ofLed.length ? ofLed.concat(trumps) : hand.slice();
    cand = cand.filter(c => suitOf(c) !== T || trumpAllowed(c));
    if (cand.length === 0) return hand.slice(); // Sicherheitsnetz (sollte nicht vorkommen)
    return cand;
  }

  // ---------- Weis (spec §7) ----------
  function weisOfHand(hand, m) {
    const list = [];
    // Vierlinge
    // Vier Gleiche (v14, offizielle Regeln laut Daniel): Under 200, Näll 150, alle anderen 100
    const quartVal = { [RU]: 200, [R9]: 150, [RA]: 100, [RK]: 100, [RO]: 100, [RB]: 100, [R8]: 100, [R7]: 100, [R6]: 100 };
    for (const r of [RU, R9, RA, RK, RO, RB, R8, R7, R6]) {
      if ([0, 1, 2, 3].every(s => hand.includes(makeCard(s, r)))) {
        list.push({ kind: 'vier', value: quartVal[r], n: 4, top: r, suit: null, trump: false,
          label: '4 ' + RANKS[r] });
      }
    }
    // Sequenzen
    for (let s = 0; s < 4; s++) {
      const rs = hand.filter(c => suitOf(c) === s).map(rankOf).sort((a, b) => a - b);
      let i = 0;
      while (i < rs.length) {
        let j = i;
        while (j + 1 < rs.length && rs[j + 1] === rs[j] + 1) j++;
        const len = j - i + 1;
        if (len >= 3) {
          const value = len >= 5 ? 100 : len === 4 ? 50 : 20;
          list.push({ kind: 'folge', value, n: len, top: rs[j], suit: s, trump: isTrumpMode(m) && s === m,
            label: len + 'er-Folge ' + SUITS[s] + ' bis ' + RANKS[rs[j]] });
        }
        i = j + 1;
      }
    }
    return list;
  }
  // > 0 wenn Weis a besser als b
  function compareWeis(a, b) {
    if (a.value !== b.value) return a.value - b.value;
    if (a.n !== b.n) return a.n - b.n;
    if (a.top !== b.top) return a.top - b.top;
    if (a.trump !== b.trump) return a.trump ? 1 : -1;
    return 0;
  }
  function bestWeis(list) {
    let best = null;
    for (const w of list) if (!best || compareWeis(w, best) > 0) best = w;
    return best;
  }
  // Ermittelt, welches Team Weis erhält. order = Spielreihenfolge im 1. Stich
  function resolveWeis(hands, m, order) {
    const perPlayer = hands.map(h => weisOfHand(h, m));
    let bestP = -1, bestW = null;
    for (const p of order) {
      const w = bestWeis(perPlayer[p]);
      if (w && (!bestW || compareWeis(w, bestW) > 0)) { bestW = w; bestP = p; }
    }
    const pts = [0, 0];
    let winnerTeam = -1;
    if (bestP >= 0) {
      winnerTeam = team(bestP);
      for (let p = 0; p < 4; p++) if (team(p) === winnerTeam) pts[winnerTeam] += perPlayer[p].reduce((a, w) => a + w.value, 0);
    }
    return { perPlayer, winnerTeam, pts };
  }

  // ---------- Stöck (spec §8) ----------
  function stoeckHolder(hands, m) {
    if (!isTrumpMode(m)) return -1;
    for (let p = 0; p < 4; p++) if (hands[p].includes(makeCard(m, RK)) && hands[p].includes(makeCard(m, RO))) return p;
    return -1;
  }

  // ---------- Hilfsfunktionen ----------
  function shuffle(a, rnd) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function sortHand(hand, m) {
    const suitOrder = [0, 1, 2, 3];
    return hand.slice().sort((a, b) => {
      const sa = suitOf(a), sb = suitOf(b);
      const ka = isTrump(a, m) ? -1 : suitOrder.indexOf(sa), kb = isTrump(b, m) ? -1 : suitOrder.indexOf(sb);
      if (ka !== kb) return ka - kb;
      if (isTrump(a, m)) return trumpStrength(b) - trumpStrength(a);
      return plainStrength(b, m === undefined ? OBENABE : m) - plainStrength(a, m === undefined ? OBENABE : m);
    });
  }

  // ---------- Spielzustand ----------
  class Game {
    constructor(opts) {
      opts = opts || {};
      this.rnd = opts.rnd || Math.random;
      this.target = opts.target || TARGET;
      this.scores = [0, 0];
      if (opts.dealer !== undefined && !(Number.isInteger(opts.dealer) && opts.dealer >= 0 && opts.dealer <= 3)) throw new Error('Ungültiger Geber');
      this.dealer = opts.dealer !== undefined ? opts.dealer : Math.floor(this.rnd() * 4);
      this.handNo = 0;
      this.log = [];
      this.history = []; // abgeschlossene Spiele
      this.startHand();
    }

    startHand(deckOverride) {
      this.dealer = this.handNo === 0 ? this.dealer : nextP(this.dealer);
      this.handNo++;
      const deck = deckOverride ? deckOverride.slice() : shuffle([...Array(36).keys()], this.rnd);
      this.hands = [0, 1, 2, 3].map(i => deck.slice(i * 9, i * 9 + 9));
      this.initialHands = this.hands.map(h => h.slice());
      this.phase = 'bidding';
      this.turn = nextP(this.dealer);
      this.highBid = null;       // {p, amount, mode}
      this.passesInRow = 0;
      this.kontra = false;
      this.kontraBy = -1;
      this.kontraQueue = [];     // Gegner, die im Kontra-Fenster gefragt werden
      this.kontraAllowedFor = -1; // Spieler, der beim regulären Zug noch Kontra sagen darf
      this.bidLog = [];
      this.trick = [];
      this.tricks = [];          // [{cards:[{p,c}], winner}]
      this.won = [[], []];       // Karten pro Team
      this.tricksPerTeam = [0, 0];
      this.lastHand = null;
      // Werte des vorherigen Spiels zurücksetzen (Review-Fund)
      this.mode = undefined;
      this.declarer = undefined;
      this.bid = undefined;
      this.weis = null;
      this.stoeck = -1;
      this.redealt = false;
    }

    // ----- Reizen -----
    minBid() {
      if (!this.highBid) return 40;
      const i = BID_LEVELS.indexOf(this.highBid.amount);
      return i + 1 < BID_LEVELS.length ? BID_LEVELS[i + 1] : null;
    }
    allowedBids() {
      const min = this.minBid();
      return min === null ? [] : BID_LEVELS.filter(b => b >= min);
    }
    // Kontra (v22): Jeder Gegner des Höchstbietenden darf jederzeit Kontra sagen, solange dessen Gebot
    // das höchste ist – unabhängig davon, wer am Zug ist und ob er schon gepasst hat. Das gilt im Reizen
    // und nach dem Reizen bis zur ersten ausgespielten Karte. Kein Rekontra.
    canKontra(p) {
      if (!this.highBid || this.kontra || team(p) === team(this.highBid.p)) return false;
      if (this.phase === 'bidding' || this.phase === 'direction') return true;
      return this.phase === 'play' && this.tricks.length === 0 && this.trick.length === 0;
    }

    act(p, action) {
      if (action && action.type === 'kontra') {
        if (!this.canKontra(p)) throw new Error('Kontra nicht erlaubt');
        this._applyKontra(p);
        return;
      }
      if (action && action.type === 'noKontra') return; // «kein Kontra» ändert nichts (Kompatibilität)
      if (this.phase === 'direction') return this._actDirection(p, action);
      if (this.phase !== 'bidding') throw new Error('Nicht in der Reizphase');
      if (p !== this.turn) throw new Error('Nicht am Zug: ' + p);
      if (action.type === 'pass') {
        this.bidLog.push({ p, type: 'pass' });
        this.kontraAllowedFor = -1;
        this.passesInRow++;
        if (!this.highBid && this.passesInRow === 4) { this._redeal(); return; }
        if (this.highBid && this.passesInRow === 3) { this._startPlay(); return; }
        this.turn = nextP(p);
        return;
      }
      if (action.type === 'bid') {
        const allowed = this.allowedBids();
        if (!allowed.includes(action.amount)) throw new Error('Ungültige Gebotshöhe ' + action.amount);
        if (!BID_MODES.includes(action.mode)) throw new Error('Ungültiger Modus');
        this.highBid = { p, amount: action.amount, mode: action.mode };
        this.bidLog.push({ p, type: 'bid', amount: action.amount, mode: action.mode });
        this.passesInRow = 0;
        this.kontraAllowedFor = -1;
        if (action.amount === 257) { this._startPlay(); return; } // Match: Reizen endet sofort
        this.turn = nextP(p);
        return;
      }
      throw new Error('Unbekannte Aktion');
    }

    _applyKontra(p) {
      this.kontra = true;
      this.kontraBy = p;
      this.bidLog.push({ p, type: 'kontra' });
      if (this.phase === 'bidding') this._startPlay(); // im Reizen beendet Kontra das Reizen sofort
    }

    _redeal() {
      this.log.push('Alle haben gepasst – neu geben.');
      this.redealt = true;
      this.startHand();
    }

    _startPlay() {
      const hb = this.highBid;
      this.declarer = hb.p;
      this.mode = hb.mode;
      this.bid = hb.amount;
      this.kontraQueue = [];
      this.kontraAllowedFor = -1;
      if (isOpenDirection(hb.mode)) {      // Slalom/Quer: zuerst die Startrichtung wählen
        this.phase = 'direction';
        this.turn = this.declarer;
        return;
      }
      this._beginPlay();
    }

    _actDirection(p, action) {
      if (p !== this.turn) throw new Error('Nicht am Zug: ' + p);
      if (action.type !== 'direction' || (action.dir !== 'oben' && action.dir !== 'unten')) throw new Error('Richtung wählen: oben/unten');
      this.mode = this.highBid.mode + (action.dir === 'unten' ? 1 : 0);
      this._beginPlay();
    }

    _beginPlay() {
      this.phase = 'play';
      this.turn = this.declarer;
      this.kontraQueue = [];
      this.kontraAllowedFor = -1;
      const order = [0, 1, 2, 3].map(i => (this.declarer + i) % 4);
      this.weis = resolveWeis(this.hands, this.mode, order);
      this.stoeck = stoeckHolder(this.hands, this.mode);
    }

    // ----- Spielen -----
    currentTrickMode() { return trickMode(this.mode, this.tricks.length); }
    legal(p) {
      if (this.phase !== 'play' || p !== this.turn) return [];
      return legalMoves(this.hands[p], this.trick, this.mode);
    }

    play(p, c) {
      if (this.phase !== 'play') throw new Error('Nicht in der Spielphase');
      if (p !== this.turn) throw new Error('Nicht am Zug: ' + p);
      if (!this.legal(p).includes(c)) throw new Error('Illegaler Zug: ' + cardName(c));
      this.hands[p] = this.hands[p].filter(x => x !== c);
      this.trick.push({ p, c });
      const ev = { played: { p, c } };
      if (this.trick.length < 4) { this.turn = nextP(p); return ev; }
      const wi = trickWinnerIndex(this.trick, trickMode(this.mode, this.tricks.length));
      const winner = this.trick[wi].p;
      const t = team(winner);
      for (const x of this.trick) this.won[t].push(x.c);
      this.tricksPerTeam[t]++;
      this.tricks.push({ cards: this.trick, winner });
      ev.trickComplete = { cards: this.trick, winner };
      this.trick = [];
      this.turn = winner;
      if (this.tricks.length === 9) ev.handOver = this._scoreHand(winner);
      return ev;
    }

    _scoreHand(lastWinner) {
      const m = this.mode;
      const cardPts = [0, 1].map(t => this.won[t].reduce((a, c) => a + points(c, m), 0));
      cardPts[team(lastWinner)] += 5;
      let match = -1;
      for (const t of [0, 1]) if (this.tricksPerTeam[t] === 9) { cardPts[t] += 100; match = t; }
      const bt = team(this.declarer);
      const made = cardPts[bt] >= this.bid;
      const bonus = this.bid * (this.kontra ? 2 : 1);
      const stoeckPts = [0, 0];
      if (this.stoeck >= 0) stoeckPts[team(this.stoeck)] = 20;
      const mult = MULT[m];
      const total = [0, 1].map(t => mult * (cardPts[t] + this.weis.pts[t] + stoeckPts[t]));
      if (made) total[bt] += bonus; else total[1 - bt] += bonus;
      this.scores[0] += total[0];
      this.scores[1] += total[1];
      const res = {
        declarer: this.declarer, mode: m, mult, bid: this.bid, kontra: this.kontra, made, match,
        cardPts, weisPts: this.weis.pts.slice(), stoeckPts, bonus, total, scores: this.scores.slice()
      };
      this.lastHand = res;
      this.history.push(res);
      if (this.scores[0] >= this.target || this.scores[1] >= this.target) {
        if (this.scores[0] !== this.scores[1]) {
          this.phase = 'gameOver';
          const w = this.scores[0] > this.scores[1] ? 0 : 1;
          res.gameWinner = w;
          res.doppel = this.scores[1 - w] < this.target / 2;
          return res;
        }
      }
      this.phase = 'handOver';
      return res;
    }

    nextHand() {
      if (this.phase !== 'handOver') throw new Error('Spiel nicht beendet');
      this.startHand();
    }
  }

  const api = {
    BID_MODES, bidModeName, isOpenDirection, MULT, SUITS, RANKS, MODES, BID_LEVELS, OBENABE, UNDENUFE, SLALOM_OBEN, SLALOM_UNTEN, QUER_OBEN, QUER_UNTEN, NUM_MODES, TARGET,
    startDir, trickMode, pointsMode,
    R6, R7, R8, R9, RB, RU, RO, RK, RA,
    suitOf, rankOf, makeCard, isTrumpMode, isTrump, team, nextP, cardName,
    points, trumpStrength, plainStrength, beats, trickWinnerIndex, legalMoves,
    weisOfHand, compareWeis, bestWeis, resolveWeis, stoeckHolder, shuffle, sortHand, Game
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Jass = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* Sidi Barrani – KI-Spieler. Nutzt nur die öffentliche Engine-API. */
(function (root) {
  'use strict';
  const J = (typeof module !== 'undefined' && module.exports) ? require('./engine.js') : root.Jass;
  const { suitOf, rankOf, isTrump, isTrumpMode, team, trumpStrength, plainStrength, legalMoves, trickWinnerIndex, BID_LEVELS, RU, R9, RA, R6 } = J;

  // ---------- Spielarten mit wechselnder Richtung (Slalom, Quer) ----------
  // m in den Funktionen unten = Richtung des aktuellen Stichs (für Rang und Bock).
  // Die Kartenwerte hängen dagegen vom ganzen Spiel ab (Startrichtung): PM hält den «Punkte-Modus».
  let PM = null;
  function points(c, m) { return J.points(c, PM !== null ? PM : m); }
  function effMode(game) { return J.trickMode(game.mode, game.tricks.length); }

  // ---------- schnelle Ausspiel-Heuristik (für Simulationen) ----------
  function strength(c, m) { return isTrump(c, m) ? 100 + trumpStrength(c) : plainStrength(c, m); }

  function rolloutChoice(p, hand, trick, m, declTeam) {
    const lm = legalMoves(hand, trick, m);
    if (lm.length === 1) return lm[0];
    if (trick.length === 0) {
      // Bieter-Team zieht Trümpfe, sonst sichere Asse/hohe Karten, sonst tiefste Karte
      if (isTrumpMode(m) && team(p) === declTeam) {
        const tr = lm.filter(c => isTrump(c, m));
        if (tr.length >= 2) return tr.reduce((a, b) => (trumpStrength(b) > trumpStrength(a) ? b : a));
      }
      const tops = lm.filter(c => !isTrump(c, m) && plainStrength(c, m) === 8);
      if (tops.length) return tops[0];
      return lm.reduce((a, b) => (points(b, m) < points(a, m) || (points(b, m) === points(a, m) && strength(b, m) < strength(a, m)) ? b : a));
    }
    const wi = trickWinnerIndex(trick, m);
    const winner = trick[wi].p;
    const partnerWins = team(winner) === team(p);
    const led = suitOf(trick[0].c);
    const winsWith = c => {
      const t2 = trick.concat([{ p, c }]);
      return trickWinnerIndex(t2, m) === t2.length - 1;
    };
    if (partnerWins && (trick.length === 3 || strength(trick[wi].c, m) >= (isTrump(trick[wi].c, m) ? 106 : 7))) {
      // Schmieren: Punkte geben, aber keine wertvollen Trümpfe
      const cand = lm.filter(c => !(isTrump(c, m) && trumpStrength(c) >= 6));
      const pool = cand.length ? cand : lm;
      return pool.reduce((a, b) => (points(b, m) > points(a, m) ? b : a));
    }
    const winning = lm.filter(winsWith);
    if (winning.length) {
      const trickPts = trick.reduce((a, x) => a + points(x.c, m), 0);
      const cheapest = winning.reduce((a, b) => (strength(b, m) < strength(a, m) ? b : a));
      if (!isTrump(cheapest, m) || trickPts >= 10 || trick.length === 3 || suitOf(cheapest) === led) return cheapest;
    }
    return lm.reduce((a, b) => (points(b, m) < points(a, m) || (points(b, m) === points(a, m) && strength(b, m) < strength(a, m)) ? b : a));
  }

  // Spielt eine Hand von einem Zwischenzustand bis zum Ende. Gibt Kartenpunkte je Team zurück.
  function playout(hands, trick, turn, M, declTeam, wonPts, tricksTeam, firstChoice) {
    const prevPM = PM; PM = J.pointsMode(M);
    hands = hands.map(h => h.slice());
    trick = trick.slice();
    let pts = wonPts.slice(), tt = tricksTeam.slice();
    let p = turn, first = true, tricksDone = tt[0] + tt[1];
    while (tricksDone < 9) {
      const m = J.trickMode(M, tricksDone);
      const c = first && firstChoice !== undefined ? firstChoice : rolloutChoice(p, hands[p], trick, m, declTeam);
      first = false;
      hands[p] = hands[p].filter(x => x !== c);
      trick.push({ p, c });
      if (trick.length < 4) { p = (p + 1) % 4; continue; }
      const w = trick[trickWinnerIndex(trick, m)].p;
      const t = team(w);
      pts[t] += trick.reduce((a, x) => a + points(x.c, m), 0);
      tt[t]++; tricksDone++;
      if (tricksDone === 9) pts[t] += 5;
      trick = []; p = w;
    }
    for (const t of [0, 1]) if (tt[t] === 9) pts[t] += 100;
    PM = prevPM;
    return pts;
  }

  // ---------- Wissen über verdeckte Karten ----------
  function knowledge(game, me) {
    const m = effMode(game);
    const played = new Set();
    const voids = [0, 1, 2, 3].map(() => new Set());
    const allTricks = game.tricks.map(t => t.cards).concat(game.trick.length ? [game.trick] : []);
    for (const tr of allTricks) {
      const led = suitOf(tr[0].c);
      for (const { p, c } of tr) {
        played.add(c);
        if (suitOf(c) === led) continue;
        if (isTrumpMode(m) && led === m) voids[p].add('T'); // kein Trumpf (ausser evtl. Puur)
        else if (!(isTrumpMode(m) && suitOf(c) === m)) voids[p].add(led);
      }
    }
    const unknown = [];
    for (let c = 0; c < 36; c++) if (!played.has(c) && !game.hands[me].includes(c)) unknown.push(c);
    return { unknown, voids };
  }

  function canHold(p, c, voids, m) {
    const v = voids[p];
    if (v.has(suitOf(c)) && !(isTrumpMode(m) && suitOf(c) === m)) return false;
    if (isTrumpMode(m) && suitOf(c) === m) {
      if (v.has(m)) return false;
      if (v.has('T') && rankOf(c) !== RU) return false;
    }
    return true;
  }

  function sampleHands(game, me, kn, rnd) {
    const m = effMode(game);
    const counts = [0, 1, 2, 3].map(p => game.hands[p].length);
    for (let attempt = 0; attempt < 30; attempt++) {
      const pool = J.shuffle(kn.unknown.slice(), rnd);
      const hands = [[], [], [], []];
      hands[me] = game.hands[me].slice();
      // eingeschränkte Karten zuerst verteilen
      pool.sort((a, b) => holders(a) - holders(b));
      let ok = true;
      for (const c of pool) {
        const opts = [0, 1, 2, 3].filter(p => p !== me && hands[p].length < counts[p] && canHold(p, c, kn.voids, m));
        if (!opts.length) { ok = false; break; }
        hands[opts[Math.floor(rnd() * opts.length)]].push(c);
      }
      if (ok) return hands;
    }
    // Rückfall: ohne Einschränkungen
    const pool = J.shuffle(kn.unknown.slice(), rnd);
    const hands = [[], [], [], []];
    hands[me] = game.hands[me].slice();
    let i = 0;
    for (let p = 0; p < 4; p++) if (p !== me) while (hands[p].length < counts[p]) hands[p].push(pool[i++]);
    return hands;
    function holders(c) { return [0, 1, 2, 3].filter(p => p !== me && canHold(p, c, kn.voids, m)).length; }
  }

  // ---------- Kartenwahl ----------
  function chooseCard(game, me, opts) {
    opts = opts || {};
    const rnd = opts.rnd || Math.random;
    const samples = opts.samples || 40;
    const lm = game.legal(me);
    if (lm.length === 1) return lm[0];
    const prevPM = PM; PM = J.pointsMode(game.mode);
    try { return chooseCardInner(game, me, opts, rnd, samples, lm); } finally { PM = prevPM; }
  }

  // Angeben (Spiele ohne Trumpf, nur erster Stich): Spielt mein Partner den Bock einer Farbe aus
  // (Obenabe: Ass, Undenufe: 6) und ich habe die nächste Karte (König bzw. 7), gebe ich sie an.
  // So weiss der Ausspielende, dass seine folgende Karte (z.B. der Ober) jetzt der Bock ist.
  function angeben(game, me, lm) {
    if (isTrumpMode(game.mode) || game.tricks.length !== 0 || game.trick.length === 0) return null;
    const lead = game.trick[0];
    if (lead.p !== (me + 2) % 4) return null;
    const m = effMode(game), s = suitOf(lead.c);
    const order = [];
    for (let r = 0; r < 9; r++) order.push(J.makeCard(s, r));
    order.sort((a, b) => strength(b, m) - strength(a, m)); // stärkste zuerst
    if (order[0] !== lead.c) return null;                 // nur wenn der Partner den Bock ausspielt
    return lm.includes(order[1]) ? order[1] : null;
  }

  function chooseCardInner(game, me, opts, rnd, samples, lm) {
    opts_partnerSuit = opts.partnerSuit !== false;
    if (opts.conventions !== false) {
      const a = angeben(game, me, lm);
      if (a !== null) { api._lastRule = 'Angeben'; return a; }
    }
    const m = effMode(game), declTeam = team(game.declarer), myTeam = team(me);
    const wonPts = [0, 1].map(t => game.won[t].reduce((a, c) => a + points(c, m), 0));
    const kn = knowledge(game, me);
    const bonus = game.bid * (game.kontra ? 2 : 1);
    const score = new Map(lm.map(c => [c, 0]));
    for (let s = 0; s < samples; s++) {
      const hands = sampleHands(game, me, kn, rnd);
      for (const c of lm) {
        const pts = playout(hands, game.trick, me, game.mode, declTeam, wonPts, game.tricksPerTeam, c);
        const made = pts[declTeam] >= game.bid;
        // Faktor gilt für Kartenpunkte, nicht fürs Gebot. Gerechnet wird in einfachen Kartenpunkten
        // (Gebot durch den Faktor geteilt), damit die Toleranzen der Jass-Regeln gleich bleiben.
        let u = pts[myTeam] - pts[1 - myTeam];
        u += ((made === (myTeam === declTeam)) ? bonus : -bonus) / J.MULT[game.mode];
        score.set(c, score.get(c) + u);
      }
    }
    // Durchschnittlicher Nutzen pro Karte (Einheit: Punktdifferenz Team – Gegner)
    const avg = new Map(lm.map(c => [c, score.get(c) / samples]));
    const leading = game.trick.length === 0;
    const sig = signals(game);
    const partner = (me + 2) % 4;

    const conv = opts.conventions !== false;
    if (leading && conv) {
      // Konvention: Verwirft der Partner eine Farbe, will er sie nicht. Spiele ihm eine andere an.
      const disc = sig.discards[partner];
      if (disc.size) {
        for (const c of lm) {
          if (isTrump(c, m)) continue;
          avg.set(c, avg.get(c) + (disc.has(suitOf(c)) ? -SIGNAL_AVOID : SIGNAL_PREFER));
        }
      }
    } else if (conv) {
      // Eigenes Verwerfen als Signal: nicht von der Farbe verwerfen, in der ich den Bock halte
      const led = suitOf(game.trick[0].c);
      for (const c of lm) {
        if (suitOf(c) === led || isTrump(c, m)) continue;
        avg.set(c, avg.get(c) + (holdsBock(game, me, suitOf(c)) ? -DISCARD_KEEP : DISCARD_OK));
      }
    }

    if (leading && conv && opts.trumpSaver !== false && trumpSaver(game, me, lm, kn)) {
      // Feste Regel: Die Gegner haben keinen Trumpf mehr. Trumpf anspielen zieht dann nur dem Partner
      // einen Trumpf heraus, den er später zum Stechen braucht. Erst die Nebenfarben spielen; Trumpf erst,
      // wenn alle übrigen Karten Böcke sind (dann ist es egal) oder nur noch Trümpfe übrig sind.
      for (const c of lm) if (isTrump(c, m)) avg.set(c, avg.get(c) - 1000);
    }

    if (leading && conv && opts.trumpHold !== false && isTrumpMode(m) && lm.some(c => !isTrump(c, m)) &&
        !(myTeam === declTeam && trumpPullOK(game, me, kn))) {
      // Einen Trumpf spielt man nicht einfach aus, weil er gerade der höchste ist: Er sticht später
      // einen punktereichen Stich. Lieber eine Nebenfarbe anziehen.
      for (const c of lm) if (isTrump(c, m)) avg.set(c, avg.get(c) - TRUMP_HOLD);
    }

    if (!leading && conv && opts.keepPartnerBock !== false && isTrumpMode(m)) {
      // Feste Regel (Daniel): Gewinnt mein Partner den Stich mit einem Bock (höchste offene Karte der Farbe),
      // steche ich ihn nicht ab, sondern werfe ab – solange ich noch etwas anderes als Trumpf habe.
      const wi = trickWinnerIndex(game.trick, m), w = game.trick[wi];
      const led = suitOf(game.trick[0].c);
      if (w.p === partner && !isTrump(w.c, m) && suitOf(w.c) === led && holdsBockCardFor(game, w.c) &&
          !lm.some(c => suitOf(c) === led && !isTrump(c, m)) && lm.some(c => !isTrump(c, m))) {
        for (const c of lm) if (isTrump(c, m)) avg.set(c, avg.get(c) - 1000);
      }
    }

    let best = lm[0];
    for (const c of lm) if (avg.get(c) > avg.get(best)) best = c;

    if (leading && conv) {
      // 0. Kontrolle behalten: Böcke zuerst ausspielen (oberste Karte einer Folge)
      api._pullTrump = false;
      const cash = bockToCash(game, me, lm, avg);
      if (cash !== null) {
        if (api._pullTrump) { api._lastRule = 'Nachtrumpfen'; return cash; }
        api._lastRule = 'Bock zuerst'; return topOfRun(game, me, cash);
      }
      // 1. Partner hat eine Farbe angezogen: erst eigene Böcke spielen, dann die Farbe zurückspielen
      const anz = anziehAnswer(game, me, lm, avg);
      if (anz !== null) { api._lastRule = 'Anziehen-Antwort'; return anz; }
      // 2. Auf ein neues Verwerf-Signal des Partners antworte ich beim nächsten Anspiel
      const answer = signalAnswer(game, me, lm);
      if (answer !== null) { api._lastRule = 'Verwerf-Antwort'; return answer; }
      // 3. Gereizte Farbe des Partners (Daniel): Hat er eine Farbe gereizt, die jetzt nicht Trumpf ist, und sie
      //    nicht verworfen, hat er dort vermutlich gute Karten. Klein anspielen, damit er stechen kann.
      const ps = partnerSuitLead(game, me, lm, avg, best, sig);
      if (ps !== null) { api._lastRule = 'Partner-Farbe aus dem Reizen'; return ps; }
      // 4. Ohne Bock selbst eine Farbe anziehen (klein anspielen, um einen Bock zu erspielen)
      const own = selfAnziehen(game, me, lm, avg, best);
      if (own !== null) { api._lastRule = 'Selbst anziehen'; return own; }
      api._lastRule = 'Simulation';
    }

    if (!leading && conv) {
      // Partner hat angezogen (klein angespielt) und ich halte den Bock: Stich nehmen, ausser der Partner gewinnt ihn sicher
      const lead = game.trick[0], ls = suitOf(lead.c);
      if (lead.p === (me + 2) % 4 && !isTrump(lead.c, m)) {
        const myBock = lm.find(c => suitOf(c) === ls && holdsBockCard(game, me, c));
        const wi0 = trickWinnerIndex(game.trick, m);
        const partnerSafe = game.trick[wi0].p === lead.p && game.trick.length === 3;
        const leadWasBock = holdsBockCardFor(game, lead.c);
        if (myBock !== undefined && !leadWasBock && !partnerSafe) {
          const t2 = game.trick.concat([{ p: me, c: myBock }]);
          if (trickWinnerIndex(t2, m) === t2.length - 1) return myBock;
        }
      }
    }

    if (!leading && conv) {
      // Abwerfen/Zugeben ohne Stich: von fast gleichwertigen Karten die punktärmste und schwächste abgeben
      const wi = trickWinnerIndex(game.trick, m);
      const partnerWinning = team(game.trick[wi].p) === myTeam;
      const winsWith = c => { const t2 = game.trick.concat([{ p: me, c }]); return trickWinnerIndex(t2, m) === t2.length - 1; };
      if (!partnerWinning && !winsWith(best)) {
        // Feste Regel: Den Gegnern nichts schenken. Unter den Karten, die den Stich nicht holen:
        // 1. Trümpfe und Böcke behalten, 2. möglichst wenig Punkte, 3. aus einer Farbe ohne eigenen Bock
        //    (Verwerf-Signal), 4. die schwächste Karte.
        const free = lm.filter(c => !winsWith(c));
        const keep = c => isTrump(c, m) || inTopRun(game, me, c);
        const key = c => [keep(c) ? 1 : 0, points(c, m), holdsBock(game, me, suitOf(c)) ? 1 : 0, strength(c, m)];
        const less = (a, b) => { const ka = key(a), kb = key(b); for (let i = 0; i < ka.length; i++) if (ka[i] !== kb[i]) return ka[i] < kb[i]; return false; };
        best = free.reduce((a, b) => (less(b, a) ? b : a));
      }
    }

    if (leading && conv && !holdsBockCard(game, me, best) && points(best, m) >= 10) {
      // Kein Banner/Ass anspielen, das kein Bock ist: es schenkt dem Gegner die Punkte
      const cheaper = lm.filter(c => !holdsBockCard(game, me, c) && points(c, m) < 10 && avg.get(best) - avg.get(c) <= GIFT_TOLERANCE);
      if (cheaper.length) {
        best = cheaper.reduce((a, b) => (avg.get(b) > avg.get(a) ? b : a));
        api._lastRule = 'Keine Punkte verschenken';
      }
    }

    if (leading && conv) {
      // Konvention: mit der stärksten Karte anspielen, wenn die Simulation kaum Unterschied sieht
      // «Stärkste Karte» = ein Bock (höchste noch offene Karte seiner Farbe). Trumpf-Böcke nur im Bieter-Team.
      const close = lm.filter(c => avg.get(best) - avg.get(c) <= LEAD_TOLERANCE);
      const bocks = close.filter(c => holdsBockCard(game, me, c) && !isTrump(c, m));
      if (bocks.length && !holdsBockCard(game, me, best)) {
        best = bocks.reduce((a, b) => (avg.get(b) > avg.get(a) ? b : a));
      }
      // Von gleichwertigen Folgekarten immer die oberste (z.B. 9 vor 6 bei 6-7-8-9)
      best = topOfRun(game, me, best);
    }
    return best;
  }

  // Trumpf ziehen lohnt sich nur mit Länge: mindestens drei Trümpfe, oder zwei, wenn draussen nicht mehr sind.
  function trumpPullOK(game, me, kn) {
    const m = effMode(game);
    const mine = game.hands[me].filter(c => isTrump(c, m)).length;
    const outstanding = kn.unknown.filter(c => suitOf(c) === m).length;
    return mine >= 3 || (mine >= 2 && mine >= outstanding);
  }

  // Trumpf-Team, Trumpfspiel, beide Gegner nachweislich ohne Trumpf (haben auf Trumpf nicht bedient)
  // und ich habe noch Nebenkarten, die nicht alle Böcke sind -> keinen Trumpf anspielen.
  function trumpSaver(game, me, lm, kn) {
    const m = effMode(game);
    if (!isTrumpMode(m) || team(me) !== team(game.declarer)) return false;
    const opp = [(me + 1) % 4, (me + 3) % 4];
    const oppTrumpless = opp.every(p => kn.voids[p].has('T') || kn.voids[p].has(m)) ||
      !kn.unknown.some(c => suitOf(c) === m && J.rankOf(c) !== J.RU);
    if (!oppTrumpless) return false;
    const side = lm.filter(c => !isTrump(c, m));
    if (!side.length || side.length === lm.length) return false;
    return !side.every(c => inTopRun(game, me, c));
  }

  const TRUMP_HOLD = 12;
  const SIGNAL_AVOID = 24, SIGNAL_PREFER = 12, DISCARD_KEEP = 14, DISCARD_OK = 4, LEAD_TOLERANCE = 8, DUMP_TOLERANCE = 10;

  // ---------- Böcke zuerst ----------
  // Bieter-Team im Trumpfspiel: erst Trümpfe ziehen (mit Trumpf-Bock), solange die Gegner noch Trumpf haben können.
  // Danach Nicht-Trumpf-Böcke, ausser ein Gegner ist dort blank und könnte trumpfen.
  function bockToCash(game, me, lm, avg) {
    const m = effMode(game), myTeam = team(me), declTeam = team(game.declarer);
    const kn = knowledge(game, me), opp = [(me + 1) % 4, (me + 3) % 4];
    if (isTrumpMode(m) && myTeam === declTeam) {
      const oppMayHaveTrump = opp.some(p => !kn.voids[p].has('T') && !kn.voids[p].has(m)) &&
        kn.unknown.some(c => suitOf(c) === m);
      const tb = lm.filter(c => isTrump(c, m) && holdsBockCard(game, me, c));
      // Trumpf ziehen nur mit Trumpf-Länge; ein einzelner hoher Trumpf wartet auf einen punktereichen Stich
      if (oppMayHaveTrump && tb.length && trumpPullOK(game, me, kn)) return tb[0];
      // Nachtrumpfen: Mit vielen Trümpfen weiter Trumpf spielen, bis die Gegner keine mehr haben.
      // Ohne Trumpf-Bock mit dem kleinsten Trumpf, damit Puur/Näll der Gegner herauskommen.
      const mine = lm.filter(c => isTrump(c, m));
      const outstanding = kn.unknown.filter(c => suitOf(c) === m).length;
      if (oppMayHaveTrump && (mine.length >= 3 || (mine.length >= 2 && mine.length >= outstanding))) {
        // Billigster Trumpf: zuerst wenig Punkte (6/7/8 vor Ober vor König vor Banner), dann tiefer Rang
        const cheap = mine.reduce((a, b) => {
          const pa = points(a, m), pb = points(b, m);
          if (pa !== pb) return pb < pa ? b : a;
          return trumpStrength(b) < trumpStrength(a) ? b : a;
        });
        // Nur nachtrumpfen, wenn das wenig kostet; Banner, Ass oder Näll nicht in einen höheren Trumpf werfen
        if (points(cheap, m) <= 4) { api._pullTrump = true; return cheap; }
      }
    }
    const safe = c => !isTrumpMode(m) || !opp.some(p => kn.voids[p].has(suitOf(c)) && !kn.voids[p].has('T'));
    const bocks = lm.filter(c => !isTrump(c, m) && holdsBockCard(game, me, c) && safe(c));
    if (!bocks.length) return null;
    return bocks.reduce((a, b) => (avg.get(b) > avg.get(a) ? b : a));
  }

  // ---------- Anziehen ----------
  // Farben, die der Partner mit einer Nicht-Bock-Karte angespielt hat und die ich noch nicht zurückgespielt habe
  function anzugSuits(game, me) {
    const m = effMode(game), partner = (me + 2) % 4;
    const played = new Set(), anz = new Map(), voidsP = new Set();
    game.tricks.forEach((t, i) => {
      const lead = t.cards[0], s0 = suitOf(lead.c);
      if (lead.p === partner && !isTrump(lead.c, m)) {
        let bock = true;
        for (let r = 0; r < 9; r++) {
          const x = J.makeCard(s0, r);
          if (x !== lead.c && !played.has(x) && strength(x, m) > strength(lead.c, m)) { bock = false; break; }
        }
        if (!bock && !anz.has(s0)) anz.set(s0, i);
      }
      if (lead.p === me && anz.has(s0)) anz.delete(s0); // zurückgespielt
      for (const { p, c } of t.cards) { played.add(c); if (p === partner && suitOf(c) !== s0) voidsP.add(s0); }
    });
    const disc = signals(game).discards[partner];
    return [...anz.keys()].filter(s => !voidsP.has(s) && !disc.has(s));
  }

  function anziehAnswer(game, me, lm, avg) {
    const m = effMode(game);
    const suits = anzugSuits(game, me);
    const want = lm.filter(c => suits.includes(suitOf(c)));
    if (!want.length) return null;
    // Zuerst eigene Böcke (Nicht-Trumpf), sofern kein Gegner die Farbe abstechen kann
    const kn = knowledge(game, me), opp = [(me + 1) % 4, (me + 3) % 4];
    const safe = c => !isTrumpMode(m) || !opp.some(p => kn.voids[p].has(suitOf(c)) && !kn.voids[p].has('T'));
    const bocks = lm.filter(c => !isTrump(c, m) && holdsBockCard(game, me, c) && safe(c));
    if (bocks.length) return bocks.reduce((a, b) => (avg.get(b) > avg.get(a) ? b : a));
    // Dann die angezogene Farbe zurück: tiefste Karte
    return want.reduce((a, b) => (points(b, m) !== points(a, m) ? (points(b, m) < points(a, m) ? b : a) : (strength(b, m) < strength(a, m) ? b : a)));
  }

  function selfAnziehen(game, me, lm, avg, best) {
    const m = effMode(game);
    if (isTrump(best, m) || holdsBockCard(game, me, best)) return null;
    if (lm.some(c => !isTrump(c, m) && holdsBockCard(game, me, c))) return null;
    const partner = (me + 2) % 4;
    const disc = signals(game).discards[partner];
    const kn = knowledge(game, me);
    const played = playedSet(game);
    const bySuit = {};
    for (const c of lm) {
      const s = suitOf(c);
      if (isTrump(c, m) || disc.has(s) || kn.voids[partner].has(s)) continue;
      (bySuit[s] = bySuit[s] || []).push(c);
    }
    let bestSuit = -1, bestScore = -1;
    for (const s of Object.keys(bySuit).map(Number)) {
      const cs = bySuit[s];
      const myTop = cs.reduce((a, b) => (strength(b, m) > strength(a, m) ? b : a));
      let higher = 0;
      for (let r = 0; r < 9; r++) {
        const x = J.makeCard(s, r);
        if (!played.has(x) && !game.hands[me].includes(x) && strength(x, m) > strength(myTop, m)) higher++;
      }
      // Am besten: nur eine fremde Karte über meiner höchsten -> nach dem Stich des Partners habe ich den Bock
      const lowPts = Math.min(...cs.map(c => points(c, m)));
      const score = (higher === 1 ? 100 : 0) + cs.length * 10 - higher - (lowPts >= 10 ? 200 : 0);
      if (score > bestScore) { bestScore = score; bestSuit = s; }
    }
    if (bestSuit < 0) return null;
    const low = bySuit[bestSuit].reduce((a, b) => (strength(b, m) < strength(a, m) ? b : a));
    if (points(low, m) >= 10) return null; // nicht mit einem Banner anziehen
    return avg.get(best) - avg.get(low) <= ANZ_TOLERANCE ? low : null;
  }
  const ANZ_TOLERANCE = 15, GIFT_TOLERANCE = 15;

  // Antwort auf ein Verwerf-Signal: Hat der Partner seit meinem letzten Anspiel eine Farbe verworfen,
  // spiele ich ihm eine Farbe an, die er nicht verworfen hat und noch bedienen kann (tiefste Karte).
  function signalAnswer(game, me, lm) {
    const m = effMode(game), partner = (me + 2) % 4;
    let lastSignal = -1, lastMyLead = -1;
    const voidsP = new Set();
    game.tricks.forEach((t, i) => {
      if (t.cards[0].p === me) lastMyLead = i;
      const led = suitOf(t.cards[0].c);
      for (const { p, c } of t.cards) {
        if (p !== partner || suitOf(c) === led) continue;
        voidsP.add(led);
        if (!isTrump(c, m)) lastSignal = i;
      }
    });
    if (lastSignal < 0 || lastMyLead > lastSignal) return null;
    const disc = signals(game).discards[partner];
    const wanted = lm.filter(c => !isTrump(c, m) && !disc.has(suitOf(c)) && !voidsP.has(suitOf(c)));
    if (!wanted.length) return null;
    // Farbe wählen, in der ich selbst am wenigsten Stärke habe (dort sitzt der Partner)
    const bySuit = {};
    for (const c of wanted) (bySuit[suitOf(c)] = bySuit[suitOf(c)] || []).push(c);
    const suits = Object.keys(bySuit).map(Number);
    suits.sort((a, b) => myTop(bySuit[a]) - myTop(bySuit[b]));
    const pick = bySuit[suits[0]];
    // Halte ich selbst den Bock dieser Farbe, spiele ihn; sonst klein anspielen
    const bock = pick.find(c => holdsBockCard(game, me, c));
    if (bock !== undefined) return bock;
    return pick.reduce((a, b) => (points(b, m) !== points(a, m) ? (points(b, m) < points(a, m) ? b : a) : (strength(b, m) < strength(a, m) ? b : a)));
    function myTop(cs) { return Math.max(...cs.map(c => strength(c, m))); }
  }

  // Verwerf-Signale: Wer eine Farbe nicht bedient und nicht trumpft, verwirft sie (= will sie nicht)
  function signals(game) {
    const m = effMode(game);
    const discards = [0, 1, 2, 3].map(() => new Set());
    const all = game.tricks.map(t => t.cards).concat(game.trick.length ? [game.trick] : []);
    for (const tr of all) {
      const led = suitOf(tr[0].c);
      for (const { p, c } of tr) if (suitOf(c) !== led && !isTrump(c, m)) discards[p].add(suitOf(c));
    }
    return { discards };
  }

  function playedSet(game) {
    const s = new Set();
    for (const t of game.tricks) for (const x of t.cards) s.add(x.c);
    for (const x of game.trick) s.add(x.c);
    return s;
  }

  // Hält 'me' die stärkste noch nicht gespielte Karte der Farbe s?
  function holdsBock(game, me, s) {
    const m = effMode(game), played = playedSet(game);
    let top = -1, topS = -1;
    for (let r = 0; r < 9; r++) {
      const c = J.makeCard(s, r);
      if (played.has(c)) continue;
      const st = strength(c, m);
      if (st > topS) { topS = st; top = c; }
    }
    return top >= 0 && game.hands[me].includes(top);
  }

  // War die (bereits gespielte) Karte c zum Zeitpunkt ihres Ausspiels ein Bock?
  function holdsBockCardFor(game, c) {
    const m = effMode(game), s = suitOf(c), played = playedSet(game);
    for (let r = 0; r < 9; r++) {
      const x = J.makeCard(s, r);
      if (x === c) continue;
      // höhere Karte, die vor diesem Stich noch nicht gespielt war (inkl. Karten im laufenden Stich)
      const inTrick = game.trick.some(t => t.c === x);
      if ((!played.has(x) || inTrick) && strength(x, m) > strength(c, m)) return false;
    }
    return true;
  }

  // Gehört Karte c zu meiner Bock-Folge? (Alle stärkeren offenen Karten der Farbe liegen in meiner Hand)
  function inTopRun(game, me, c) {
    const m = effMode(game), s = suitOf(c), played = playedSet(game), hand = game.hands[me];
    for (let r = 0; r < 9; r++) {
      const x = J.makeCard(s, r);
      if (x !== c && !played.has(x) && !hand.includes(x) && strength(x, m) > strength(c, m)) return false;
    }
    return true;
  }

  // Ist Karte c (in meiner Hand) der Bock ihrer Farbe?
  function holdsBockCard(game, me, c) {
    const m = effMode(game), s = suitOf(c), played = playedSet(game);
    for (let r = 0; r < 9; r++) {
      const x = J.makeCard(s, r);
      if (x !== c && !played.has(x) && strength(x, m) > strength(c, m)) return false;
    }
    return true;
  }

  // Oberste Karte der lückenlosen Folge (nach Spielstärke, gespielte Karten zählen nicht als Lücke)
  function topOfRun(game, me, c) {
    const m = effMode(game), s = suitOf(c), played = playedSet(game), hand = game.hands[me];
    const order = [];
    for (let r = 0; r < 9; r++) {
      const x = J.makeCard(s, r);
      if (!played.has(x)) order.push(x);
    }
    order.sort((a, b) => strength(a, m) - strength(b, m));
    let i = order.indexOf(c);
    // Nach oben in der Folge nur, wenn die höhere Karte keine Punkte verschenkt (Banner/Ass nur als Bock)
    while (i + 1 < order.length && hand.includes(order[i + 1]) &&
           (points(order[i + 1], m) < 10 || holdsBockCard(game, me, order[i + 1]))) i++;
    return order[i];
  }

  // ---------- Reizen ----------
  // Erwartete Kartenpunkte des eigenen Teams, wenn ich mit Modus m ausspiele
  // constraints: bisherige Gebote der anderen Spieler [{p, mode, amount}]. Die simulierten Hände werden so
  // gezogen, dass sie zu diesen Geboten passen (wer «100 Schellen» sagt, hat auch Schellen-Trümpfe).
  function evaluateModes(hand, me, rnd, n, constraints, only) {
    n = n || 24;
    constraints = constraints || [];
    const rest = [];
    for (let c = 0; c < 36; c++) if (!hand.includes(c)) rest.push(c);
    const deal = () => {
      let hands = null;
      for (let tries = 0; tries < 40; tries++) {
        const pool = J.shuffle(rest.slice(), rnd);
        hands = [[], [], [], []];
        let i = 0;
        for (let p = 0; p < 4; p++) hands[p] = p === me ? hand.slice() : pool.slice(i, i += 9);
        if (constraints.every(k => plausibleBidderHand(hands[k.p], k.mode, k.amount))) break;
      }
      return hands;
    };
    const res = [];
    res.samples = [];
    for (let m = 0; m < J.NUM_MODES; m++) {
      let sum = 0;
      const smp = [];
      res.samples.push(smp);
      if (only && !only.includes(m)) { res.push(0); continue; }
      for (let k = 0; k < n; k++) {
        const hands = deal();
        const pts = playout(hands, [], me, m, team(me), [0, 0], [0, 0]);
        sum += pts[team(me)];
        smp.push(pts[team(me)]);
      }
      res.push(sum / n);
    }
    return res;
  }

  function trumpHolding(hand, m) {
    if (isTrumpMode(m)) {
      const tr = hand.filter(c => suitOf(c) === m);
      return { puur: tr.some(c => rankOf(c) === RU), nell: tr.some(c => rankOf(c) === R9), n: tr.length };
    }
    const tops = hand.filter(c => plainStrength(c, m) === 8).length;
    return { tops };
  }

  // Kontra nur, wenn meine eigene Hand die Gegner sehr wahrscheinlich unter ihr Gebot drückt.
  // Ich zähle «sichere Stiche» (Böcke-Folgen von oben) und schätze deren Punkte (Kartenwert + ~10 pro Stich).
  function sureDefense(hand, m) {
    let pts = 0, tricks = 0;
    const add = c => { pts += points(c, m) + 10; tricks++; };
    for (let s = 0; s < 4; s++) {
      const mine = hand.filter(c => suitOf(c) === s);
      if (!mine.length) continue;
      const order = [];
      for (let r = 0; r < 9; r++) order.push(J.makeCard(s, r));
      order.sort((a, b) => strength(b, m) - strength(a, m)); // stärkste zuerst
      if (isTrumpMode(m) && s === m) {
        let i = 0;
        while (i < order.length && mine.includes(order[i])) { add(order[i]); i++; }
        if (mine.length >= 4 && i < mine.length) tricks++; // langer Trumpf macht meist noch einen Stich
      } else {
        // Seitenfarbe: im Trumpfspiel ist nur ein Ass bei kurzer Farbe sicher, ohne Trumpf die ganze Folge von oben
        if (isTrumpMode(m)) { if (mine.includes(order[0]) && mine.length <= 3) add(order[0]); }
        else { let i = 0; while (i < order.length && mine.includes(order[i])) { add(order[i]); i++; } }
      }
    }
    return { pts, tricks };
  }

  // Passt eine (simulierte) Bieterhand zum Gebot? Gleiche Mindestanforderungen, die die KI selbst beim Reizen nutzt.
  // Ein gereiztes Spiel simulieren. Bei Slalom/Quer ist die Richtung noch offen: der Bieter nimmt die bessere.
  function bidPlayout(hands, p, m) {
    if (!J.isOpenDirection(m)) return playout(hands, [], p, m, team(p), [0, 0], [0, 0]);
    const a = playout(hands, [], p, m, team(p), [0, 0], [0, 0]), b = playout(hands, [], p, m + 1, team(p), [0, 0], [0, 0]);
    return a[team(p)] >= b[team(p)] ? a : b;
  }

  function plausibleBidderHand(hand, m, amount) {
    const cnt = r => hand.filter(c => rankOf(c) === r).length;
    if (m === J.OBENABE) return cnt(RA) >= 2 + (amount >= 100 ? 1 : 0);
    if (m === J.UNDENUFE) return cnt(R6) >= 2 + (amount >= 100 ? 1 : 0);
    if (m >= 6) return cnt(RA) >= 1 && cnt(R6) >= 1 && cnt(RA) + cnt(R6) >= 3 + (amount >= 100 ? 1 : 0);
    const tr = hand.filter(c => suitOf(c) === m);
    const top = tr.filter(c => rankOf(c) === RU || rankOf(c) === R9).length;
    return top >= 1 && tr.length >= 3 + (amount >= 100 ? 1 : 0);
  }

  // Wahrscheinlichkeit, dass der Bieter sein Gebot verfehlt – aus Sicht von Spieler 'me' (nur eigene Hand bekannt)
  function failProbability(game, me, hb, rnd, n) {
    const known = game.hands[me];
    const rest = [];
    for (let c = 0; c < 36; c++) if (!known.includes(c)) rest.push(c);
    let fails = 0, done = 0;
    for (let k = 0; k < n; k++) {
      let hands = null, last = null;
      for (let tries = 0; tries < 40; tries++) {
        const pool = J.shuffle(rest.slice(), rnd);
        const hs = [[], [], [], []]; let i = 0;
        for (let p = 0; p < 4; p++) hs[p] = p === me ? known.slice() : pool.slice(i, i += 9);
        last = hs;
        if (plausibleBidderHand(hs[hb.p], hb.mode, hb.amount)) { hands = hs; break; }
      }
      // Keine «passende» Bieter-Hand möglich (z.B. weil ich Puur und Näll selbst halte): Das Gebot ist aus
      // meiner Sicht kaum zu schaffen – mit gewöhnlicher Verteilung weiterrechnen statt die Probe zu verwerfen.
      if (!hands) hands = last;
      const pts = bidPlayout(hands, hb.p, hb.mode);
      done++;
      if (pts[team(hb.p)] < hb.amount) fails++;
    }
    return done ? fails / done : 0;
  }

  // Aussicht eines Gebots aus meiner Sicht: Scheiter-Wahrscheinlichkeit und mittlere Kartenpunkt-Differenz des Bieter-Teams
  function bidOutlook(game, me, hb, rnd, n) {
    const known = game.hands[me];
    const rest = [];
    for (let c = 0; c < 36; c++) if (!known.includes(c)) rest.push(c);
    let fails = 0, done = 0, diff = 0;
    for (let k = 0; k < n; k++) {
      let hands = null, last = null;
      for (let tries = 0; tries < 40; tries++) {
        const pool = J.shuffle(rest.slice(), rnd);
        const hs = [[], [], [], []]; let i = 0;
        for (let p = 0; p < 4; p++) hs[p] = p === me ? known.slice() : pool.slice(i, i += 9);
        last = hs;
        if (plausibleBidderHand(hs[hb.p], hb.mode, hb.amount)) { hands = hs; break; }
      }
      // Keine «passende» Bieter-Hand möglich (z.B. weil ich Puur und Näll selbst halte): Das Gebot ist aus
      // meiner Sicht kaum zu schaffen – mit gewöhnlicher Verteilung weiterrechnen statt die Probe zu verwerfen.
      if (!hands) hands = last;
      const pts = bidPlayout(hands, hb.p, hb.mode);
      done++;
      if (pts[team(hb.p)] < hb.amount) fails++;
      diff += pts[team(hb.p)] - pts[1 - team(hb.p)];
    }
    return done ? { pFail: fails / done, diff: diff / done } : { pFail: 0.5, diff: 0 };
  }

  // Spielarten, die ich und mein Partner beide gereizt haben
  function sharedModes(game, me) {
    const partner = (me + 2) % 4, mine = new Set(), his = new Set();
    for (const e of game.bidLog) if (e.type === 'bid') { if (e.p === me) mine.add(e.mode); if (e.p === partner) his.add(e.mode); }
    return [...mine].filter(m => his.has(m));
  }
  // Kann ich unsere gemeinsame Spielart noch weiterreizen (innerhalb der Gebotsgrenze)?
  function sharedRaise(game, me) {
    if (game.phase !== 'bidding') return false;
    const b = game.allowedBids()[0], hb = game.highBid;
    if (b === undefined) return false;
    return sharedModes(game, me).some(m => {
      const block = hb && team(hb.p) !== team(me) && J.MULT[m] < J.MULT[hb.mode] ? 10 * (J.MULT[hb.mode] - J.MULT[m]) : 0;
      return b <= bidCap(game, me, m, true) + block;
    });
  }
  // Farben, die ein Spieler im Reizen als Trumpf gesagt hat
  function bidSuits(game, p) {
    const s = new Set();
    for (const e of game.bidLog) if (e.type === 'bid' && e.p === p && e.mode <= 3) s.add(e.mode);
    return s;
  }
  const PARTNER_SUIT_TOL = 15;
  function partnerSuitLead(game, me, lm, avg, best, sig) {
    if (opts_partnerSuit === false) return null;
    const m = effMode(game), partner = (me + 2) % 4, kn = knowledge(game, me);
    const cands = [];
    for (const s of bidSuits(game, partner)) {
      if (isTrumpMode(m) && s === m) continue;                 // ist ohnehin Trumpf
      if (sig.discards[partner].has(s) || kn.voids[partner].has(s)) continue; // verworfen oder blank
      const mine = lm.filter(c => suitOf(c) === s);
      if (!mine.length) continue;
      // die kleinste Karte der Farbe (wenig Punkte, schwach)
      const low = mine.reduce((a, b) => (points(b, m) < points(a, m) || (points(b, m) === points(a, m) && strength(b, m) < strength(a, m)) ? b : a));
      if (avg.get(best) - avg.get(low) <= PARTNER_SUIT_TOL) cands.push(low);
    }
    if (!cands.length) return null;
    return cands.reduce((a, b) => (avg.get(b) > avg.get(a) ? b : a));
  }
  let opts_partnerSuit = true;

  // Hat mein Partner nach dem letzten Gebot schon gepasst?
  function partnerPassedSinceHigh(game, me) {
    const partner = (me + 2) % 4;
    for (let i = game.bidLog.length - 1; i >= 0; i--) {
      const e = game.bidLog[i];
      if (e.type === 'bid') return false;
      if (e.p === partner && e.type === 'pass') return true;
    }
    return false;
  }

  // Nach dem Reizen (bis zur ersten Karte): Will ich jetzt noch Kontra geben?
  function chooseKontra(game, me, opts) {
    opts = opts || {};
    return game.canKontra(me) && decideKontra(game, me, opts.rnd || Math.random);
  }

  function decideKontra(game, me, rnd) {
    const hb = game.highBid;
    if (!hb || team(hb.p) === team(me)) return false;  // nie auf das eigene Team
    if (hb.amount < 60) return false;
    return failProbability(game, me, hb, rnd || Math.random, 80) >= KONTRA_THRESHOLD;
  }
  const KONTRA_THRESHOLD = 0.8; // gemessen: ~79 % der Kontras richtig

  const cache = new Map();
  // Reizstil «mutig» (Ø Gebot ~109, ~58 % erfüllt, +24 Punkte/Spiel gegen den alten, vorsichtigen Stil).
  // Taktik (v14): klein eröffnen und in kleinen Schritten steigern, das Maximum erst am Schluss
  // (gemessen: +14 Punkte/Spiel gegen «gleich aufs Maximum»). openGap gross = Eröffnung mit dem kleinsten Gebot.
  // swing: so viel schlechter darf die Partner-Spielart sein, damit ich trotzdem zu ihr schwenke.
  // supportGap: so viel muss unser Team über dem Partner-Gebot schaffen, damit ich seine Spielart hochreize.
  const BID = { margin: -6, openGap: 999, partnerGap: 15, swing: 12, supportGap: 10,
                ev: true, evMargin: 5, evSwing: 15, minP: 0 };

  // ---------- Reizen nach Erwartungswert (v16, mit Faktoren) ----------
  // Wert eines Vertrags für das spielende Team = Faktor × (eigene − gegnerische Kartenpunkte) + Gebot × (2·P(erfüllt) − 1).
  // Weis/Stöck sind beim Reizen unbekannt und werden nicht geschätzt.
  const CAL = m => isTrumpMode(m) ? 4 : m >= 8 ? 18 : 10;   // Rollouts überschätzen Spiele ohne Trumpf
  function contractValue(samples, m, b) {
    const cal = CAL(m);
    let made = 0, d = 0;
    for (const x0 of samples) {
      const x = x0 >= 257 ? 257 : x0 - cal;
      if (x >= b) made++;
      d += x >= 257 ? 257 : 2 * x - 157;
    }
    const n = samples.length || 1, p = made / n;
    return { v: J.MULT[m] * (d / n) + b * (2 * p - 1), p };
  }
  function openValue(ev, m, b) {
    const a = contractValue(ev.samples[m], m, b);
    if (!J.isOpenDirection(m)) return a;
    const c = contractValue(ev.samples[m + 1], m + 1, b);
    return a.v >= c.v ? a : c;
  }
  // Startrichtung bei Slalom/Quer wählen: die Richtung mit dem höheren Wert für mein Gebot
  function chooseDirection(game, me, opts) {
    opts = opts || {};
    const rnd = opts.rnd || Math.random;
    const lastBid = {};
    for (const e of game.bidLog) if (e.type === 'bid' && e.p !== me) lastBid[e.p] = { p: e.p, mode: e.mode, amount: e.amount };
    const ev = evaluateModes(game.hands[me], me, rnd, opts.n || 32, Object.values(lastBid), [game.mode, game.mode + 1]);
    const up = contractValue(ev.samples[game.mode], game.mode, game.bid).v;
    const down = contractValue(ev.samples[game.mode + 1], game.mode + 1, game.bid).v;
    return { type: 'direction', dir: up >= down ? 'oben' : 'unten' };
  }
  const outlookCache = new Map();
  // Wie hoch darf ich mit dieser Hand reizen? Faustregeln guter Spieler:
  //  Trumpf: 40 + 10 pro Trumpf, Puur +20, Näll +10, Trumpf-Ass +10, Nebenfarben-Ass +5
  //    (Näll zu viert ohne Puur und Ass: 90; Puur, Näll, Ass zu fünft: 130)
  //  Obenabe/Undenufe: 30 + 20 pro Ass (Sechser), +5 pro König (Siebner)
  //  Slalom/Quer: 30 + 15 pro Ass und Sechser
  //  Hat der Partner dieselbe Spielart schon gereizt: +30 (er trägt einen Teil der Punkte)
  function bidCap(game, me, m, useBids) {
    const hand = game.hands[me], has = c => hand.includes(c);
    const cnt = r => hand.filter(c => rankOf(c) === r).length;
    let cap;
    if (m <= 3) {
      const n = hand.filter(c => suitOf(c) === m).length;
      const sideA = hand.filter(c => rankOf(c) === RA && suitOf(c) !== m).length;
      cap = 40 + 10 * n + (has(J.makeCard(m, RU)) ? 20 : 0) + (has(J.makeCard(m, R9)) ? 10 : 0) +
        (has(J.makeCard(m, RA)) ? 10 : 0) + 5 * sideA;
    } else if (m === J.OBENABE) cap = 30 + 20 * cnt(RA) + 5 * cnt(J.RK);
    else if (m === J.UNDENUFE) cap = 30 + 20 * cnt(R6) + 5 * cnt(J.R7);
    else cap = 30 + 15 * (cnt(RA) + cnt(R6));
    if (useBids !== false) {
      const partner = (me + 2) % 4;
      if (game.bidLog.some(e => e.type === 'bid' && e.p === partner && e.mode === m)) cap += 30;
    }
    return cap;
  }

  // Hat mein Partner diese Spielart im Reizen gesagt?
  function partnerBid(game, me, m) {
    const partner = (me + 2) % 4;
    return game.bidLog.some(e => e.type === 'bid' && e.p === partner && e.mode === m);
  }
  // Unterstützung für den Partner-Trumpf: Puur, oder Näll mit mindestens einer weiteren Karte, oder drei Trümpfe
  function canSupport(hand, t) {
    const n = hand.filter(c => suitOf(c) === t).length;
    return hand.includes(J.makeCard(t, RU)) || (hand.includes(J.makeCard(t, R9)) && n >= 2) || n >= 3;
  }
  // Starker eigener Trumpf: Grenze ohne Partner-Bonus mindestens 100 (z.B. Puur zu viert, Näll+Ass zu viert)
  function strongTrump(hand, t) {
    return bidCap({ hands: [hand], bidLog: [] }, 0, t, false) >= 100;
  }

  function evBid(game, me, opts, ev, adj, pBid, rnd, useBids) {
    const allowed = game.allowedBids();
    if (!allowed.length) return { type: 'pass' };
    const b = allowed[0];                       // klein steigern: immer nur die nächste Stufe
    const hb = game.highBid;
    const oppHolds = hb && team(hb.p) !== team(me);
    // Wert, wenn ich passe
    let vPass = 0;
    if (hb && !oppHolds) vPass = openValue(ev, hb.mode, hb.amount).v;
